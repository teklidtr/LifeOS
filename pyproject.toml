[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeos"
version = "0.2.0"
description = "Private, Obsidian-native LifeOS implementation"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "types-PyYAML>=6.0"]
mcp = ["mcp>=1.28,<2"]

[project.scripts]
lifeos = "lifeos.entrypoint:main"
lifeos-mcp = "lifeos.mcp.__main__:main"
lifeos-desktop-bridge = "lifeos.bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
