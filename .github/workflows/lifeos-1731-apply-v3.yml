name: LIFEOS-1731 bounded implementation v3

on:
  push:
    branches: [lifeos-1731-migrate-proposal-publishers]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[lifeos-1731-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lifeos-1731-migrate-proposal-publishers

      - name: Apply migration with corrected preflight
        shell: python
        run: |
          from __future__ import annotations
          import textwrap
          from pathlib import Path

          workflow = Path('.github/workflows/lifeos-1731-apply-v2.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply migration and ordering fixes\n        shell: python\n        run: |\n'
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n      - name: Install uv', start)
          exec(textwrap.dedent(workflow[start:end]), {})

          path = Path('src/lifeos/proposals/publication.py')
          text = path.read_text(encoding='utf-8')
          old = '''def preflight_proposal_publication(*, vault_root: Path, proposal_id: str) -> None:\n    """Validate the canonical publication target without creating a proposal draft."""\n    _validate_proposal_id(proposal_id)\n    proposals_fd = -1\n    try:\n        proposals_fd = _open_or_create_proposals_root(vault_root)\n        _raise_if_proposal_exists(proposals_fd, proposal_id)\n    finally:\n        if proposals_fd >= 0:\n            os.close(proposals_fd)\n'''
          new = '''def preflight_proposal_publication(*, vault_root: Path, proposal_id: str) -> None:\n    """Validate the canonical publication target without creating a proposal draft."""\n    _validate_proposal_id(proposal_id)\n    vault_fd = proposals_fd = -1\n    try:\n        vault_fd, proposals_fd = _open_proposals_root(vault_root)\n        _raise_if_proposal_exists(proposals_fd, proposal_id)\n    finally:\n        if proposals_fd >= 0:\n            os.close(proposals_fd)\n        if vault_fd >= 0:\n            os.close(vault_fd)\n'''
          if text.count(old) != 1:
              raise RuntimeError(f'preflight body match count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/lifeos-1731-apply-v3.yml').unlink()

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra mcp

      - name: Format touched Python
        run: >-
          uv run ruff format
          src/lifeos/proposals/publication.py
          src/lifeos/copilot/proposals.py
          src/lifeos/copilot/replanning.py
          src/lifeos/feedback/proposals.py
          src/lifeos/reviews/decisions.py
          src/lifeos/ownership/reconciliation.py
          src/lifeos/ingestion/proposals.py
          src/lifeos/ingestion/_proposals_core.py
          tests/ingestion/test_proposals.py
          tests/proposals/test_remaining_publisher_adoption.py

      - name: Focused validation
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          uv run pytest -q tests/proposals/test_remaining_publisher_adoption.py tests/ingestion/test_proposal_root_hardening.py
          uv run pytest -q tests/copilot tests/planning_feedback tests/reviews tests/ownership tests/ingestion tests/proposals
          uv run ruff check src/lifeos/proposals/publication.py src/lifeos/copilot/proposals.py src/lifeos/copilot/replanning.py src/lifeos/feedback/proposals.py src/lifeos/reviews/decisions.py src/lifeos/ownership/reconciliation.py src/lifeos/ingestion/proposals.py src/lifeos/ingestion/_proposals_core.py tests/ingestion/test_proposals.py tests/proposals/test_remaining_publisher_adoption.py
          uv run mypy src
          python scripts/validate_tasks.py
          git diff --check
          echo '--- remaining canonical proposal document write sites ---'
          git grep -n -E '(atomic_write_file_secure|write_bytes|write_text).*"(proposal\.md|patches\.json|review\.json)"' -- src/lifeos || true

      - name: Commit validated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "LIFEOS-1731 Migrate remaining proposal publishers [lifeos-1731-applied]"
          git push origin HEAD:lifeos-1731-migrate-proposal-publishers
