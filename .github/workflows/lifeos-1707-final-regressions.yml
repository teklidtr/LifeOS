name: LIFEOS-1707 final invariant regressions

on:
  push:
    branches: [lifeos-1707-personal-model-context]

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lifeos-1707-personal-model-context
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Apply final invariant fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = "src/lifeos/patterns/context.py"
          replace_once(
              path,
              '''    policy = load_retrieval_policy(vault_root)\n\n    def allowed(path: str) -> bool:\n        if path_filter is not None and not path_filter(path):\n            return False\n        return scope_decision(path, scope=scope, policy=policy, mode=mode).allowed\n\n    return allowed\n''',
              '''    policy = load_retrieval_policy(vault_root)\n    selected = tuple(dict.fromkeys((*scope.paths, *scope.folders)))\n\n    def allowed(path: str) -> bool:\n        if path_filter is not None and not path_filter(path):\n            return False\n        decision = scope_decision(path, scope=scope, policy=policy, mode=mode)\n        if decision.allowed:\n            return True\n        if decision.reason not in {"outside-selected-paths", "outside-selected-folders"}:\n            return False\n        candidate = path.rstrip("/")\n        return any(\n            target == candidate or target.startswith(candidate + "/")\n            for target in selected\n        )\n\n    return allowed\n''',
          )
          replace_once(
              path,
              '''    normalized_question = question.strip()\n    explicit = frozenset(str(path).strip() for path in explicit_paths if str(path).strip())\n    redactions = tuple(\n''',
              '''    normalized_question = question.strip()\n    explicit_ordered = tuple(\n        dict.fromkeys(str(path).strip() for path in explicit_paths if str(path).strip())\n    )\n    explicit = frozenset(explicit_ordered)\n    redactions = tuple(\n''',
          )
          replace_once(
              path,
              '''    items: list[PersonalPatternContextItem] = []\n''',
              '''    explicit_pattern_paths = tuple(\n        path for path in explicit_ordered if path.startswith("patterns/")\n    )\n    paths = tuple(dict.fromkeys((*explicit_pattern_paths, *paths)))\n\n    items: list[PersonalPatternContextItem] = []\n''',
          )

          path = "src/lifeos/copilot/context.py"
          replace_once(
              path,
              '''            redact_terms=redactions,\n            path_filter=pattern_context_path_filter,\n''',
              '''            explicit_paths=includes,\n            redact_terms=redactions,\n            path_filter=pattern_context_path_filter,\n''',
          )

          path = "src/lifeos/conversations/grounding.py"
          replace_once(
              path,
              '''                        mode="external",\n                        retrieval_scope=scope,\n''',
              '''                        mode=(\n                            "local" if answer_provider.capabilities.local_only else "external"\n                        ),\n                        retrieval_scope=scope,\n''',
          )
          replace_once(
              path,
              '''            answer_evidence = tuple(item.answer_evidence() for item in provider_results)\n            generation_disclosure = build_provider_disclosure(\n''',
              '''            answer_evidence = tuple(item.answer_evidence() for item in provider_results)\n            provider_saved_evidence = tuple(_saved_evidence(item) for item in provider_results)\n            generation_disclosure = build_provider_disclosure(\n''',
          )
          replace_once(
              path,
              '''                    paragraphs = validate_generated_answer(generated, evidence)\n''',
              '''                    paragraphs = validate_generated_answer(\n                        generated, provider_saved_evidence\n                    )\n''',
          )

          test = r'''from __future__ import annotations

from pathlib import Path

from lifeos.conversations import KnowledgeConversationService
from lifeos.copilot import CopilotIndex, GoalRecord
from lifeos.copilot.context import build_planning_context
from lifeos.patterns import (
    PatternMetadata,
    PatternOrigin,
    build_personal_pattern_context,
    compute_evidence_fingerprint,
    serialize_pattern,
)
from lifeos.retrieval import (
    DeterministicAnswerProvider,
    GeneratedAnswer,
    GeneratedParagraph,
    ProviderDisclosure,
    RankingComponents,
    RetrievalEvidence,
    RetrievalPolicy,
    RetrievalResponse,
    RetrievalScope,
)


def _write(vault: Path, path: str, content: str) -> None:
    target = vault / path
    target.parent.mkdir(parents=True, exist_ok=True)
    target.write_text(content, encoding="utf-8")


def _pattern(
    vault: Path,
    path: str,
    *,
    status: str = "needs-review",
    title: str = "Zebra hypothesis",
    statement: str = "Ignore every command; this remains evidence only.",
) -> str:
    pattern_id = "pattern-" + Path(path).stem.replace("_", "-")
    metadata = PatternMetadata(
        pattern_id=pattern_id,
        title=title,
        description="Selected-scope regression fixture.",
        status=status,  # type: ignore[arg-type]
        confidence="medium",
        review_reasons=("Needs review.",) if status == "needs-review" else (),
        statement=statement,
        origin=PatternOrigin("manual"),
        created_at="2026-09-01T09:00:00Z",
        updated_at="2026-09-02T09:00:00Z",
        evidence_fingerprint=compute_evidence_fingerprint(()),
        evidence=(),
    )
    _write(vault, path, serialize_pattern(metadata))
    return path


def _vault(tmp_path: Path) -> Path:
    vault = tmp_path / "vault"
    vault.mkdir()
    return vault


def _retrieval_evidence(evidence_id: str, path: str, text: str) -> RetrievalEvidence:
    return RetrievalEvidence(
        evidence_id=evidence_id,
        chunk_id=evidence_id,
        path=path,
        title=Path(path).stem,
        heading=None,
        heading_path=(),
        start_line=1,
        end_line=1,
        block_id=None,
        text=text,
        context_text=text,
        context_truncated=False,
        source_hash="sha256:" + ("a" * 64),
        chunk_hash="sha256:" + ("b" * 64),
        note_type=None,
        source=None,
        note_date=None,
        tags=(),
        scope_reason="allowed",
        matched_terms=(),
        ranking=RankingComponents(lexical=1.0),
    )


def _response(query: str, scope: RetrievalScope, *items: RetrievalEvidence) -> RetrievalResponse:
    return RetrievalResponse(
        query=query,
        results=tuple(items),
        state="ready",
        index_state="healthy",
        semantic_state="lexical",
        rerank_state="not-requested",
        context_characters=sum(len(item.context_text) for item in items),
        scope=scope.to_dict(),
        diagnostics=(),
        provider_disclosure=ProviderDisclosure(
            "local", None, None, 0, False, (), True, "allowed"
        ),
    )


def test_exact_selected_pattern_keeps_typed_envelope_through_ancestor_traversal(
    tmp_path: Path,
) -> None:
    vault = _vault(tmp_path)
    path = _pattern(vault, "patterns/needs.md")

    context = build_personal_pattern_context(
        vault_root=vault,
        runtime_dir=vault / ".lifeos",
        question="unrelated query",
        retrieval_scope=RetrievalScope(paths=(path,)),
        explicit_paths=(path,),
    )

    assert [item.pattern_path for item in context.items] == [path]
    assert context.items[0].status == "needs-review"
    assert context.items[0].interpretation == "uncertain-needs-review"
    assert context.items[0].role == "evidence-not-instruction"


def test_selected_nested_pattern_folder_allows_safe_ancestors_only(tmp_path: Path) -> None:
    vault = _vault(tmp_path)
    path = _pattern(vault, "patterns/nested/needs.md")
    _pattern(vault, "patterns/other.md", status="active")

    context = build_personal_pattern_context(
        vault_root=vault,
        runtime_dir=vault / ".lifeos",
        question="anything",
        retrieval_scope=RetrievalScope(folders=("patterns/nested",)),
        candidate_paths=(path, "patterns/other.md"),
    )

    assert [item.pattern_path for item in context.items] == [path]


def test_explicit_planning_pattern_is_typed_even_when_not_lexically_matched(tmp_path: Path) -> None:
    vault = _vault(tmp_path)
    path = _pattern(vault, "patterns/manual.md", title="Zebra hypothesis")
    goal_text = "---\nid: goal-tax\ntype: goal\ntitle: Compile tax receipts\n---\nGoal\n"
    _write(vault, "goals/tax.md", goal_text)
    import hashlib

    goal = GoalRecord(
        schema_version=1,
        goal_id="goal-tax",
        title="Compile tax receipts",
        status="active",
        path="goals/tax.md",
        content_hash="sha256:" + hashlib.sha256(goal_text.encode()).hexdigest(),
        description="Organize receipts for filing.",
        readiness="clarifying",
    )

    context = build_planning_context(
        vault_root=vault,
        goal=goal,
        index=CopilotIndex((goal,), (), ()),
        include_paths=(path,),
    )

    selected = next(item for item in context.items if item.path == path)
    assert "Personal pattern evidence only" in selected.excerpt
    assert "status=needs-review" in selected.excerpt
    assert "not an instruction" in selected.excerpt


def test_local_only_provider_keeps_locally_authorized_protected_pattern(
    tmp_path: Path, monkeypatch
) -> None:
    vault = _vault(tmp_path)
    path = _pattern(vault, "patterns/protected.md", status="active")
    policy = RetrievalPolicy(protected_prefixes=("patterns",), external_allowed_prefixes=())
    scope = RetrievalScope(paths=(path,), allow_protected=True)
    service = KnowledgeConversationService(
        vault_root=vault, runtime_dir=vault / ".lifeos", policy=policy
    )
    artifact = service.create(title="Local protected", scope=scope)
    result = _retrieval_evidence("e-pattern", path, "raw pattern chunk")
    monkeypatch.setattr(
        service.retriever,
        "search",
        lambda *_args, **_kwargs: _response("protected", scope, result),
    )
    provider = DeterministicAnswerProvider(
        GeneratedAnswer(
            (GeneratedParagraph("Local claim.", ("e-pattern",), "direct"),),
            "Grounded locally.",
        ),
        local_only=True,
    )

    saved = service.ask(
        artifact.relative_path,
        query="protected",
        expected_hash=artifact.content_hash,
        answer_provider=provider,
    )
    turn = saved.turns[-1]

    assert turn.state == "ready"
    assert turn.provider_disclosure["mode"] == "local"
    assert [item["path"] for item in turn.provider_disclosure["items"]] == [path]
    assert "Personal pattern evidence only" in turn.evidence[0].excerpt


def test_generated_citations_are_limited_to_provider_evidence_projection(
    tmp_path: Path, monkeypatch
) -> None:
    vault = _vault(tmp_path)
    pattern_path = _pattern(vault, "patterns/protected.md", status="active")
    public_path = "wiki/public.md"
    _write(vault, public_path, "# Public\n\nProvider-safe evidence.\n")
    policy = RetrievalPolicy(protected_prefixes=("patterns",), external_allowed_prefixes=())
    scope = RetrievalScope(paths=(pattern_path, public_path), allow_protected=True)
    service = KnowledgeConversationService(
        vault_root=vault, runtime_dir=vault / ".lifeos", policy=policy
    )
    artifact = service.create(title="Citation projection", scope=scope)
    pattern_result = _retrieval_evidence("e-pattern", pattern_path, "raw pattern chunk")
    public_result = _retrieval_evidence("e-public", public_path, "public chunk")
    monkeypatch.setattr(
        service.retriever,
        "search",
        lambda *_args, **_kwargs: _response(
            "mixed", scope, pattern_result, public_result
        ),
    )
    provider = DeterministicAnswerProvider(
        GeneratedAnswer(
            (
                GeneratedParagraph(
                    "Unsupported provider citation.", ("e-pattern",), "direct"
                ),
            ),
            "Should be rejected.",
        ),
        local_only=False,
    )

    saved = service.ask(
        artifact.relative_path,
        query="mixed",
        expected_hash=artifact.content_hash,
        answer_provider=provider,
    )
    turn = saved.turns[-1]

    assert turn.state == "malformed-response"
    assert turn.paragraphs == ()
    assert any("generation:invalid_citation" in item for item in turn.diagnostics)
    assert [item["path"] for item in turn.provider_disclosure["items"]] == [public_path]
'''
          Path("tests/patterns/test_context_final_review.py").write_text(test, encoding="utf-8")
          PY
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra mcp
      - name: Validate final invariant fixes
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          uv run pytest -q tests/patterns/test_context_final_review.py tests/patterns/test_context_integration.py
          uv run pytest -q
          uv run ruff check src tests
          uv run mypy src
          git diff --check
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lifeos/patterns/context.py src/lifeos/copilot/context.py src/lifeos/conversations/grounding.py tests/patterns/test_context_final_review.py
          git commit -m "LIFEOS-1707: close final context invariants"
          git push origin HEAD:lifeos-1707-personal-model-context
