name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra mcp

      - name: Documentation impact gate
        if: github.event_name == 'pull_request'
        run: uv run python scripts/check_documentation_impact.py --base-ref "origin/${{ github.base_ref }}"

      - name: Ruff repository gate
        run: uv run ruff check .

      - name: Mypy repository gate
        run: uv run mypy src

      - name: Compile Python sources
        run: uv run python -m compileall -q src tests

      - name: Validate manual links
        run: uv run python scripts/validate_manual_links.py

      - name: Collect test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: uv run pytest --collect-only -q

      - name: Run test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: uv run pytest -q

  docker-setup-e2e:
    name: docker-setup-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run clean-room setup and MCP gate
        run: ./scripts/run-setup-integration-docker.sh
