name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra mcp

      - name: Ruff repository audit
        continue-on-error: true
        run: uv run ruff check .

      - name: Ruff changed Python files
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
              ;;
            *)
              echo "No diff base for this event; skipping changed-file Ruff gate."
              exit 0
              ;;
          esac

          mapfile -d '' files < <(git diff --name-only -z --diff-filter=ACMR "$base" "$head" -- '*.py')
          if ((${#files[@]})); then
            uv run ruff check "${files[@]}"
          else
            echo "No changed Python files."
          fi

      - name: Mypy repository audit
        continue-on-error: true
        run: uv run mypy src

      - name: Mypy changed source files
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
              ;;
            *)
              echo "No diff base for this event; skipping changed-source mypy gate."
              exit 0
              ;;
          esac

          mapfile -d '' changed < <(git diff --name-only -z --diff-filter=ACMR "$base" "$head" -- '*.py')
          files=()
          for file in "${changed[@]}"; do
            if [[ "$file" == src/* ]]; then
              files+=("$file")
            fi
          done
          if ((${#files[@]})); then
            uv run mypy "${files[@]}"
          else
            echo "No changed Python source files."
          fi

      - name: Compile Python sources
        run: uv run python -m compileall -q src tests

      - name: Validate manual links
        run: uv run python scripts/validate_manual_links.py

      - name: Run test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: uv run pytest -q

  docker-setup-e2e:
    name: docker-setup-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run clean-room setup and MCP gate
        run: ./scripts/run-setup-integration-docker.sh
