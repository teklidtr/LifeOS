name: LIFEOS-1734 formatter baseline audit

on:
  push:
    branches:
      - lifeos-1734-ruff-format-baseline
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  formatter-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: lifeos-1734-ruff-format-baseline
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra mcp

      - name: Verify current formatter baseline
        run: uv run ruff format --check .

      - name: Audit isolated formatter commit
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import subprocess
          import types

          before = "9190f5235a836490655b0dd57dbe56b6fd180dcf"
          after = "1519e987b38499cee22ec97a1edac24c278d4f9a"
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{before}..{after}"], text=True
          ).splitlines()
          unexpected = [path for path in changed if not path.endswith(".py")]
          if unexpected:
              raise SystemExit(f"unexpected non-Python formatter paths: {unexpected}")

          def semantic_ast(source: str, path: str) -> str:
              tree = ast.parse(source, filename=path, type_comments=True)
              for ignored in tree.type_ignores:
                  ignored.lineno = 0
              return ast.dump(tree, include_attributes=False)

          def code_signature(code: types.CodeType):
              constants = tuple(
                  code_signature(value) if isinstance(value, types.CodeType) else value
                  for value in code.co_consts
              )
              return (
                  code.co_argcount,
                  code.co_posonlyargcount,
                  code.co_kwonlyargcount,
                  code.co_nlocals,
                  code.co_stacksize,
                  code.co_flags,
                  code.co_code,
                  constants,
                  code.co_names,
                  code.co_varnames,
                  code.co_freevars,
                  code.co_cellvars,
              )

          structural_mismatches = []
          bytecode_mismatches = []
          for path in changed:
              old = subprocess.check_output(
                  ["git", "show", f"{before}:{path}"], text=True
              )
              new = subprocess.check_output(
                  ["git", "show", f"{after}:{path}"], text=True
              )
              if semantic_ast(old, path) == semantic_ast(new, path):
                  continue
              structural_mismatches.append(path)
              if code_signature(compile(old, path, "exec")) != code_signature(
                  compile(new, path, "exec")
              ):
                  bytecode_mismatches.append(path)

          if bytecode_mismatches:
              raise SystemExit(
                  f"formatter changes alter normalized bytecode: {bytecode_mismatches}"
              )
          print(f"Formatter-only Python files audited: {len(changed)}")
          print(
              "AST-structural but bytecode-equivalent formatter changes: "
              f"{structural_mismatches}"
          )
          PY
