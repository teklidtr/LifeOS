name: LIFEOS-1734 formatter baseline

on:
  push:
    branches:
      - lifeos-1734-ruff-format-baseline

permissions:
  contents: write

jobs:
  format-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: lifeos-1734-ruff-format-baseline
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra mcp

      - name: Apply locked Ruff formatter
        shell: bash
        run: |
          uv run ruff format .
          uv run ruff format --check .
          git diff --check
          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then
            echo "No formatter changes produced."
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              *.py|*.pyi|*.ipynb) ;;
              *)
                echo "Unexpected formatter path: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"
          git diff --stat

      - name: Commit formatter baseline
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "LIFEOS-1734 apply Ruff formatter baseline"
          git push origin HEAD:lifeos-1734-ruff-format-baseline
