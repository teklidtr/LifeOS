name: LIFEOS-1734 formatter baseline audit

on:
  push:
    branches:
      - lifeos-1734-ruff-format-baseline
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  formatter-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: lifeos-1734-ruff-format-baseline
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra mcp

      - name: Verify current formatter baseline
        run: uv run ruff format --check .

      - name: Audit isolated formatter commit
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import subprocess

          before = "9190f5235a836490655b0dd57dbe56b6fd180dcf"
          after = "1519e987b38499cee22ec97a1edac24c278d4f9a"
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{before}..{after}"], text=True
          ).splitlines()
          unexpected = [path for path in changed if not path.endswith(".py")]
          if unexpected:
              raise SystemExit(f"unexpected non-Python formatter paths: {unexpected}")

          for path in changed:
              old = subprocess.check_output(
                  ["git", "show", f"{before}:{path}"], text=True
              )
              new = subprocess.check_output(
                  ["git", "show", f"{after}:{path}"], text=True
              )
              old_ast = ast.dump(
                  ast.parse(old, filename=path, type_comments=True),
                  include_attributes=False,
              )
              new_ast = ast.dump(
                  ast.parse(new, filename=path, type_comments=True),
                  include_attributes=False,
              )
              if old_ast != new_ast:
                  raise SystemExit(f"AST mismatch after formatting: {path}")

          print(f"AST-equivalent formatter changes: {len(changed)} Python files")
          PY
