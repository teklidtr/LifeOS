name: LIFEOS-1731 bounded implementation v4

on:
  push:
    branches: [lifeos-1731-migrate-proposal-publishers]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[lifeos-1731-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lifeos-1731-migrate-proposal-publishers

      - name: Apply migration with updated fault seams
        shell: python
        run: |
          from __future__ import annotations
          import textwrap
          from pathlib import Path

          workflow = Path('.github/workflows/lifeos-1731-apply-v3.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply migration with corrected preflight\n        shell: python\n        run: |\n'
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n      - name: Install uv', start)
          exec(textwrap.dedent(workflow[start:end]), {})

          path = Path('tests/ingestion/test_proposals.py')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'proposal_id="new-id",\n        target_path="wiki/target.md",\n        proposal_markdown=b"body",\n        patches_json=b\'{"schema_version":2,"proposal_id":"new-id","operations":[]}\',':
              'proposal_id="prop-20260713T123000Z-abcdef12",\n        target_path="wiki/target.md",\n        proposal_markdown=b"body",\n        patches_json=b\'{"schema_version":2,"proposal_id":"prop-20260713T123000Z-abcdef12","operations":[]}\',',
              'proposal_id="new-id-2",\n        target_path="wiki/target.md",\n        proposal_markdown=b"body",\n        patches_json=b\'{"schema_version":2,"proposal_id":"new-id-2","operations":[]}\',':
              'proposal_id="prop-20260713T123001Z-abcdef13",\n        target_path="wiki/target.md",\n        proposal_markdown=b"body",\n        patches_json=b\'{"schema_version":2,"proposal_id":"prop-20260713T123001Z-abcdef13","operations":[]}\',',
              'proposal_id="new-id-3",\n        target_path="wiki/target.md",\n        proposal_markdown=b"body",\n        patches_json=b\'{"schema_version":2,"proposal_id":"new-id-3","operations":[]}\',':
              'proposal_id="prop-20260713T123002Z-abcdef14",\n        target_path="wiki/target.md",\n        proposal_markdown=b"body",\n        patches_json=b\'{"schema_version":2,"proposal_id":"prop-20260713T123002Z-abcdef14","operations":[]}\',',
              'assert not (proposals_root / "new-id").exists()':
              'assert not (proposals_root / "prop-20260713T123000Z-abcdef12").exists()',
              'assert not (proposals_root / "new-id-2").exists()':
              'assert not (proposals_root / "prop-20260713T123001Z-abcdef13").exists()',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'test replacement expected one match, got {count}: {old[:50]}')
              text = text.replace(old, new, 1)

          old_test = '''def test_os_open_failure_raises_proposal_publication_error(tmp_path: Path):
    proposals_root = tmp_path / "vault" / "proposals"
    proposals_root.mkdir(parents=True)

    docs = WikiProposalDocuments(
        proposal_id="prop-20260713T123002Z-abcdef14",
        target_path="wiki/target.md",
        proposal_markdown=b"body",
        patches_json=b'{"schema_version":2,"proposal_id":"prop-20260713T123002Z-abcdef14","operations":[]}',
    )

    # We patch atomic_write to avoid actual filesystem calls during the failure test
    with patch("lifeos.proposals.publication.atomic_write_file_secure"):
        original_open = os.open

        def mock_open(path, flags, *args, **kwargs):
            if "new-id-3" in str(path) and getattr(mock_open, "called", False) is False:
                mock_open.called = True
                raise PermissionError("denied")
            return original_open(path, flags, *args, **kwargs)

        with patch("lifeos.proposals.publication.os.open", side_effect=mock_open):
            with pytest.raises(ProposalPublicationError) as exc:
                persist_wiki_proposal(proposals_root=proposals_root, documents=docs)
            assert isinstance(exc.value.__cause__.__cause__, PermissionError)
            assert not (proposals_root / "new-id-3").exists()
'''
          new_test = '''def test_staging_open_failure_raises_proposal_publication_error(tmp_path: Path):
    proposals_root = tmp_path / "vault" / "proposals"
    proposals_root.mkdir(parents=True)

    docs = WikiProposalDocuments(
        proposal_id="prop-20260713T123002Z-abcdef14",
        target_path="wiki/target.md",
        proposal_markdown=b"body",
        patches_json=b'{"schema_version":2,"proposal_id":"prop-20260713T123002Z-abcdef14","operations":[]}',
    )

    with patch(
        "lifeos.proposals.publication._create_staging_directory",
        side_effect=PermissionError("denied"),
    ):
        with pytest.raises(ProposalPublicationError) as exc:
            persist_wiki_proposal(proposals_root=proposals_root, documents=docs)
        assert isinstance(exc.value.__cause__.__cause__, PermissionError)
        assert not (proposals_root / "prop-20260713T123002Z-abcdef14").exists()
'''
          if text.count(old_test) != 1:
              raise RuntimeError(f'old staging test match count={text.count(old_test)}')
          path.write_text(text.replace(old_test, new_test, 1), encoding='utf-8')

          Path('.github/workflows/lifeos-1731-apply-v4.yml').unlink()

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra mcp

      - name: Format touched Python
        run: >-
          uv run ruff format
          src/lifeos/proposals/publication.py
          src/lifeos/copilot/proposals.py
          src/lifeos/copilot/replanning.py
          src/lifeos/feedback/proposals.py
          src/lifeos/reviews/decisions.py
          src/lifeos/ownership/reconciliation.py
          src/lifeos/ingestion/proposals.py
          src/lifeos/ingestion/_proposals_core.py
          tests/ingestion/test_proposals.py
          tests/proposals/test_remaining_publisher_adoption.py

      - name: Focused validation
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          uv run pytest -q tests/proposals/test_remaining_publisher_adoption.py tests/ingestion/test_proposal_root_hardening.py
          uv run pytest -q tests/copilot tests/planning_feedback tests/reviews tests/ownership tests/ingestion tests/proposals
          uv run ruff check src/lifeos/proposals/publication.py src/lifeos/copilot/proposals.py src/lifeos/copilot/replanning.py src/lifeos/feedback/proposals.py src/lifeos/reviews/decisions.py src/lifeos/ownership/reconciliation.py src/lifeos/ingestion/proposals.py src/lifeos/ingestion/_proposals_core.py tests/ingestion/test_proposals.py tests/proposals/test_remaining_publisher_adoption.py
          uv run mypy src
          python scripts/validate_tasks.py
          git diff --check
          echo '--- remaining canonical proposal document write sites ---'
          git grep -n -E '(atomic_write_file_secure|write_bytes|write_text).*"(proposal\.md|patches\.json|review\.json)"' -- src/lifeos || true

      - name: Commit validated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "LIFEOS-1731 Migrate remaining proposal publishers [lifeos-1731-applied]"
          git push origin HEAD:lifeos-1731-migrate-proposal-publishers
