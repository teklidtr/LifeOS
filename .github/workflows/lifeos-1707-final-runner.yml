name: LIFEOS-1707 final regression runner

on:
  push:
    branches:
      - lifeos-1707-personal-model-context

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lifeos-1707-personal-model-context
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Apply staged patch
        run: |
          python - <<'PYRUN'
          from pathlib import Path

          workflow = Path('.github/workflows/lifeos-1707-final-regressions.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          raw = workflow[start:end]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in raw.splitlines())
          exec(compile(script, '<lifeos-1707-final>', 'exec'))
          test_path = Path('tests/patterns/test_context_final_review.py')
          text = test_path.read_text(encoding='utf-8')
          old = "    _write(vault, public_path, \"# Public\\n\\nProvider-safe evidence.\\n\")\n    policy = RetrievalPolicy(protected_prefixes=(\"patterns\",), external_allowed_prefixes=())\n    scope = RetrievalScope(paths=(pattern_path, public_path), allow_protected=True)\n    service = KnowledgeConversationService(\n        vault_root=vault, runtime_dir=vault / \".lifeos\", policy=policy\n    )\n"
          new = "    _write(vault, public_path, \"# Public\\n\\nProvider-safe evidence.\\n\")\n    _write(vault, \"system/retrieval-policy.yml\", \"schema_version: 1\\nprotected_prefixes: [patterns]\\nexternal_allowed_prefixes: []\\n\")\n    scope = RetrievalScope(paths=(pattern_path, public_path), allow_protected=True)\n    service = KnowledgeConversationService(vault_root=vault, runtime_dir=vault / \".lifeos\")\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected one citation fixture replacement, found {text.count(old)}')
          test_path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PYRUN
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra mcp
      - name: Validate
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          uv run pytest -q tests/patterns/test_context_final_review.py tests/patterns/test_context_integration.py
          uv run pytest -q
          uv run ruff check src tests
          uv run mypy src
          git diff --check
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lifeos/patterns/context.py src/lifeos/copilot/context.py src/lifeos/conversations/grounding.py tests/patterns/test_context_final_review.py
          git commit -m "LIFEOS-1707: close final context invariants"
          git push origin HEAD:lifeos-1707-personal-model-context
