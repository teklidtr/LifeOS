name: LIFEOS-1731 review fixes

on:
  push:
    branches: [lifeos-1731-migrate-proposal-publishers]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[lifeos-1731-review-fixes]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lifeos-1731-migrate-proposal-publishers

      - name: Apply batched Codex review fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise RuntimeError(f"{path}: expected {count} matches, found {actual}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          publication = "src/lifeos/proposals/publication.py"
          replace(
              publication,
              "        _raise_if_proposal_exists(proposals_fd, proposal_id)",
              "        _raise_if_proposal_exists(\n            proposals_fd,\n            proposal_id,\n            display_path=vault_root / \"proposals\" / proposal_id,\n        )",
              count=2,
          )
          replace(
              publication,
              '''        except FileExistsError as exc:\n            raise ProposalPublicationError(\n                "proposal_exists",\n                f"Proposal directory already exists: proposals/{proposal_id}",\n            ) from exc''',
              '''        except FileExistsError as exc:\n            duplicate = FileExistsError(\n                exc.errno or errno.EEXIST,\n                exc.strerror or os.strerror(errno.EEXIST),\n                str(vault_root / "proposals" / proposal_id),\n            )\n            raise ProposalPublicationError(\n                "proposal_exists",\n                f"Proposal directory already exists: proposals/{proposal_id}",\n            ) from duplicate''',
          )
          replace(
              publication,
              '''def _raise_if_proposal_exists(proposals_fd: int, proposal_id: str) -> None:\n    try:\n        os.stat(proposal_id, dir_fd=proposals_fd, follow_symlinks=False)\n    except FileNotFoundError:\n        return\n    except OSError as exc:\n        raise ProposalPublicationError("proposal_publish_failed", str(exc)) from exc\n    raise ProposalPublicationError(\n        "proposal_exists",\n        f"Proposal directory already exists: proposals/{proposal_id}",\n    )''',
              '''def _raise_if_proposal_exists(\n    proposals_fd: int, proposal_id: str, *, display_path: Path\n) -> None:\n    try:\n        os.stat(proposal_id, dir_fd=proposals_fd, follow_symlinks=False)\n    except FileNotFoundError:\n        return\n    except OSError as exc:\n        raise ProposalPublicationError("proposal_publish_failed", str(exc)) from exc\n    duplicate = FileExistsError(\n        errno.EEXIST,\n        os.strerror(errno.EEXIST),\n        str(display_path),\n    )\n    raise ProposalPublicationError(\n        "proposal_exists",\n        f"Proposal directory already exists: proposals/{proposal_id}",\n    ) from duplicate''',
          )
          replace(
              publication,
              '''        try:\n            proposal_fd = open_directory_secure(Path(directory_name), dir_fd=proposals_fd)\n        except SecureIOError as exc:\n            raise ProposalPublicationError("proposal_publish_failed", str(exc)) from exc\n        created_identity = _fd_identity(proposal_fd)\n        if not _directory_entry_matches(proposals_fd, directory_name, proposal_fd):''',
              '''        try:\n            created_info = os.stat(\n                directory_name,\n                dir_fd=proposals_fd,\n                follow_symlinks=False,\n            )\n        except OSError as exc:\n            raise ProposalPublicationError("proposal_publish_failed", str(exc)) from exc\n        created_identity = (created_info.st_dev, created_info.st_ino)\n        try:\n            proposal_fd = open_directory_secure(Path(directory_name), dir_fd=proposals_fd)\n        except SecureIOError as exc:\n            _remove_owned_empty_directory(\n                parent_fd=proposals_fd,\n                name=directory_name,\n                identity=created_identity,\n            )\n            raise ProposalPublicationError("proposal_publish_failed", str(exc)) from exc\n        if _fd_identity(proposal_fd) != created_identity or not _directory_entry_matches(\n            proposals_fd, directory_name, proposal_fd\n        ):''',
          )
          replace(
              publication,
              '''def _file_entry_matches(parent_fd: int, name: str, identity: FileIdentity) -> bool:\n    try:\n        info = os.stat(name, dir_fd=parent_fd, follow_symlinks=False)\n    except OSError:\n        return False\n    return stat.S_ISREG(info.st_mode) and (info.st_dev, info.st_ino) == identity\n\n\ndef _cleanup_owned_attempt(''',
              '''def _file_entry_matches(parent_fd: int, name: str, identity: FileIdentity) -> bool:\n    try:\n        info = os.stat(name, dir_fd=parent_fd, follow_symlinks=False)\n    except OSError:\n        return False\n    return stat.S_ISREG(info.st_mode) and (info.st_dev, info.st_ino) == identity\n\n\ndef _remove_owned_empty_directory(\n    *, parent_fd: int, name: str, identity: FileIdentity\n) -> None:\n    try:\n        info = os.stat(name, dir_fd=parent_fd, follow_symlinks=False)\n    except OSError:\n        return\n    if not stat.S_ISDIR(info.st_mode) or (info.st_dev, info.st_ino) != identity:\n        return\n    try:\n        os.rmdir(name, dir_fd=parent_fd)\n    except OSError:\n        pass\n\n\ndef _cleanup_owned_attempt(''',
          )

          core = "src/lifeos/ingestion/_proposals_core.py"
          replace(
              core,
              '''    proposal_id = str(documents.proposal_id)\n    proposal_dir = proposals_root / proposal_id\n    try:''',
              '''    proposal_id = str(documents.proposal_id)\n    proposal_dir = proposals_root / proposal_id\n    if proposals_root.name != "proposals":\n        raise ProposalPublicationError(\n            "Proposal root must be the canonical proposals directory"\n        )\n    try:''',
          )

          adapters = (
              (
                  "src/lifeos/copilot/proposals.py",
                  '''    except ProposalPublicationError as exc:\n        raise CopilotProposalError(f"could not publish copilot proposal: {exc}") from exc''',
                  '''    except ProposalPublicationError as exc:\n        detail = (\n            str(exc.__cause__)\n            if exc.code == "proposal_exists" and isinstance(exc.__cause__, FileExistsError)\n            else str(exc)\n        )\n        raise CopilotProposalError(f"could not publish copilot proposal: {detail}") from exc''',
              ),
              (
                  "src/lifeos/copilot/replanning.py",
                  '''    except ProposalPublicationError as exc:\n        raise ReplanningError(f"could not publish replanning proposal: {exc}") from exc''',
                  '''    except ProposalPublicationError as exc:\n        detail = (\n            str(exc.__cause__)\n            if exc.code == "proposal_exists" and isinstance(exc.__cause__, FileExistsError)\n            else str(exc)\n        )\n        raise ReplanningError(f"could not publish replanning proposal: {detail}") from exc''',
              ),
              (
                  "src/lifeos/feedback/proposals.py",
                  '''    except ProposalPublicationError as exc:\n        raise FeedbackProposalError(f"Could not publish feedback proposal: {exc}") from exc''',
                  '''    except ProposalPublicationError as exc:\n        detail = (\n            str(exc.__cause__)\n            if exc.code == "proposal_exists" and isinstance(exc.__cause__, FileExistsError)\n            else str(exc)\n        )\n        raise FeedbackProposalError(f"Could not publish feedback proposal: {detail}") from exc''',
              ),
              (
                  "src/lifeos/reviews/decisions.py",
                  '''    except ProposalPublicationError as exc:\n        raise ReviewProposalError(f"Could not publish review proposal: {exc}") from exc''',
                  '''    except ProposalPublicationError as exc:\n        detail = (\n            str(exc.__cause__)\n            if exc.code == "proposal_exists" and isinstance(exc.__cause__, FileExistsError)\n            else str(exc)\n        )\n        raise ReviewProposalError(f"Could not publish review proposal: {detail}") from exc''',
              ),
              (
                  "src/lifeos/ownership/reconciliation.py",
                  '''    except ProposalPublicationError as error:\n        raise OwnershipReconciliationError(\n            f"Could not publish ownership release proposal: {error}"\n        ) from error''',
                  '''    except ProposalPublicationError as error:\n        detail = (\n            str(error.__cause__)\n            if error.code == "proposal_exists"\n            and isinstance(error.__cause__, FileExistsError)\n            else str(error)\n        )\n        raise OwnershipReconciliationError(\n            f"Could not publish ownership release proposal: {detail}"\n        ) from error''',
              ),
          )
          for path, old, new in adapters:
              replace(path, old, new)

          test = Path("tests/proposals/test_publication.py")
          text = test.read_text(encoding="utf-8")
          insertion = '''\n\ndef test_staging_open_failure_cleans_owned_directory(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    vault = _vault(tmp_path)\n    original = publication_module.open_directory_secure\n\n    def fail_staging_open(path: Path, *, dir_fd: int | None = None) -> int:\n        if path.name.startswith(".lifeos-proposal-stage-"):\n            from lifeos._secure_io import SecureIOError\n\n            raise SecureIOError("open_failed", "injected staging open failure")\n        return original(path, dir_fd=dir_fd)\n\n    monkeypatch.setattr(publication_module, "open_directory_secure", fail_staging_open)\n\n    with pytest.raises(ProposalPublicationError) as failed:\n        publish_proposal_documents(\n            vault_root=vault,\n            proposal_id=PROPOSAL_ID,\n            documents=DOCUMENTS,\n        )\n\n    assert failed.value.code == "proposal_publish_failed"\n    assert list((vault / "proposals").iterdir()) == []\n'''
          marker = "\n\ndef test_partial_write_cleans_owned_staging_directory("
          if marker not in text:
              raise RuntimeError("publication test insertion marker missing")
          text = text.replace(marker, insertion + marker, 1)
          test.write_text(text, encoding="utf-8")

          adoption = Path("tests/proposals/test_remaining_publisher_adoption.py")
          text = adoption.read_text(encoding="utf-8")
          text = text.replace("from pathlib import Path\n", "import errno\nimport os\nfrom pathlib import Path\n", 1)
          old = '''    adapter(**kwargs)\n    with pytest.raises(error_type):\n        adapter(**kwargs)\n    assert (vault / "proposals" / "proposal-duplicate" / "review.json").read_bytes() == b"{}\\n"'''
          new = '''    adapter(**kwargs)\n    with pytest.raises(error_type) as duplicate:\n        adapter(**kwargs)\n    prefix = next(item[3] for item in _feature_adapters() if item[0] is module)\n    old_detail = str(\n        FileExistsError(\n            errno.EEXIST,\n            os.strerror(errno.EEXIST),\n            str(vault / "proposals" / "proposal-duplicate"),\n        )\n    )\n    assert str(duplicate.value) == f"{prefix}: {old_detail}"\n    assert (vault / "proposals" / "proposal-duplicate" / "review.json").read_bytes() == b"{}\\n"'''
          if old not in text:
              raise RuntimeError("adoption duplicate assertion marker missing")
          text = text.replace(old, new, 1)
          text += '''\n\ndef test_ingestion_rejects_noncanonical_proposals_root_without_misplacing_draft(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    monkeypatch.setattr(ingestion_core, "build_review_snapshot_bytes_from_patches", _review_bytes)\n    requested_root = tmp_path / "drafts"\n    with pytest.raises(\n        ingestion_core.ProposalPublicationError,\n        match="canonical proposals directory",\n    ):\n        ingestion_core._persist_proposal_documents(\n            proposals_root=requested_root, documents=_ingestion_documents()\n        )\n    assert not requested_root.exists()\n    assert not (tmp_path / "proposals" / "proposal-ingestion").exists()\n'''
          adoption.write_text(text, encoding="utf-8")

          Path(".github/workflows/lifeos-1731-review-fixes.yml").unlink()

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra mcp

      - name: Format touched Python
        run: >-
          uv run ruff format
          src/lifeos/proposals/publication.py
          src/lifeos/ingestion/_proposals_core.py
          src/lifeos/copilot/proposals.py
          src/lifeos/copilot/replanning.py
          src/lifeos/feedback/proposals.py
          src/lifeos/reviews/decisions.py
          src/lifeos/ownership/reconciliation.py
          tests/proposals/test_publication.py
          tests/proposals/test_remaining_publisher_adoption.py

      - name: Validate review fixes
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          uv run pytest -q tests/proposals/test_publication.py tests/proposals/test_remaining_publisher_adoption.py tests/ingestion/test_proposal_root_hardening.py
          uv run pytest -q tests/copilot tests/planning_feedback tests/reviews tests/ownership tests/ingestion tests/proposals
          uv run pytest -q tests/captures tests/conversations tests/experiments tests/patterns tests/facade tests/mcp tests/integration
          uv run pytest -q
          uv run ruff check .
          uv run mypy src
          python scripts/validate_tasks.py
          git diff --check
          uv run ruff format --check \
            src/lifeos/proposals/publication.py \
            src/lifeos/ingestion/_proposals_core.py \
            src/lifeos/copilot/proposals.py \
            src/lifeos/copilot/replanning.py \
            src/lifeos/feedback/proposals.py \
            src/lifeos/reviews/decisions.py \
            src/lifeos/ownership/reconciliation.py \
            tests/proposals/test_publication.py \
            tests/proposals/test_remaining_publisher_adoption.py
          set +e
          uv run ruff format --check . > /tmp/lifeos-format.log 2>&1
          FORMAT_STATUS=$?
          set -e
          cat /tmp/lifeos-format.log
          if [ "$FORMAT_STATUS" -ne 0 ]; then
            COUNT=$(grep -Eo '[0-9]+ files would be reformatted' /tmp/lifeos-format.log | head -1 | grep -Eo '^[0-9]+')
            test -n "$COUNT"
            if [ "$COUNT" -gt 257 ]; then
              echo "Repository formatter debt regressed above the LIFEOS-1734 branch baseline: $COUNT"
              exit 1
            fi
          fi

      - name: Record review fix evidence
        env:
          RUN_ID: ${{ github.run_id }}
        shell: python
        run: |
          import os
          from pathlib import Path

          task = Path("tasks/completed/1731-migrate-remaining-proposal-document-publishers.md")
          text = task.read_text(encoding="utf-8")
          text += f'''\n\n## Codex review fixes\n\nNormal Codex review of head `d899c3bbf0c13528a8a5ba699f864150362310d0` identified three P2 compatibility/cleanup findings. They were batched into one invariant-focused fix:\n\n- ingestion now explicitly rejects a `proposals_root` whose final component is not the canonical `proposals` directory, preventing a successful write to a different path than the returned path;\n- the shared publisher records the identity of a newly created staging directory before opening it and removes that empty directory only when the still-present entry matches the owned identity after an open failure;\n- all five migrated feature adapters preserve their former duplicate-publication `FileExistsError` detail while still translating through their existing feature-specific exception prefixes.\n\nPost-review validation run `{{os.environ["RUN_ID"]}}` repeated the focused publisher/ingestion coverage, both task validation groups, the full pytest suite, Ruff, mypy, task workflow validation, diff checks, and touched-file formatting before this commit.\n'''
          task.write_text(text, encoding="utf-8")

      - name: Validate final task evidence
        run: |
          python scripts/validate_tasks.py
          git diff --check

      - name: Commit validated review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "LIFEOS-1731 Address Codex review findings [lifeos-1731-review-fixes]"
          git push origin HEAD:lifeos-1731-migrate-proposal-publishers
