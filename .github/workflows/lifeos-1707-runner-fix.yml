name: LIFEOS-1707 runner fix

on:
  push:
    branches: [lifeos-1707-personal-model-context]

permissions:
  contents: write

jobs:
  patch-runner:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lifeos-1707-personal-model-context
      - name: Fix vault path import in development runner
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/lifeos-1707-apply.yml')
          text = path.read_text()
          old = '''          from lifeos.vault import (\n              VaultAccessError,\n              iter_vault_markdown_paths,\n              read_vault_markdown,\n          )\n'''
          new = '''          from lifeos.vault import VaultAccessError, read_vault_markdown\n          from lifeos.vault_paths import iter_vault_markdown_paths\n'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one development-runner import block')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/lifeos-1707-apply.yml
          git commit -m "LIFEOS-1707: fix development runner vault path import"
          git push origin HEAD:lifeos-1707-personal-model-context
