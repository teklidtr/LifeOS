name: LIFEOS-1668 auth-order patch runner

on:
  push:
    branches:
      - lifeos-1668-harden-generated-ownership-fs
    paths:
      - .github/workflows/lifeos-1668-apply-auth-order-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lifeos-1668-harden-generated-ownership-fs
          fetch-depth: 0
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/lifeos-1668.patch <<'PATCH'
          diff --git a/src/lifeos/ownership/manifest.py b/src/lifeos/ownership/manifest.py
          index fa2a693..b707a88 100644
          --- a/src/lifeos/ownership/manifest.py
          +++ b/src/lifeos/ownership/manifest.py
          @@ -263,6 +263,47 @@ class GeneratedOwnership:
                           ) from exc
                       raise PathSafetyError(f"Target {rel_path} cannot be inspected safely") from exc
           
          +    def _inspect_target_metadata(self, rel_path: str) -> os.stat_result | None:
          +        """Inspect target existence/type without opening or hashing file contents."""
          +        target_name = PurePosixPath(rel_path).name
          +        parent_relative = PurePosixPath(rel_path).parent.as_posix()
          +
          +        def inspect_at(parent_fd: int) -> os.stat_result | None:
          +            try:
          +                return os.stat(target_name, dir_fd=parent_fd, follow_symlinks=False)
          +            except FileNotFoundError:
          +                return None
          +            except OSError as exc:
          +                raise PathSafetyError(
          +                    f"Target {rel_path} cannot be inspected safely"
          +                ) from exc
          +
          +        if parent_relative == ".":
          +            try:
          +                parent_fd = os.open(self.vault_root, _DIRECTORY_FLAGS)
          +            except OSError as exc:
          +                raise PathSafetyError(
          +                    f"Target {rel_path} cannot be inspected safely"
          +                ) from exc
          +            try:
          +                return inspect_at(parent_fd)
          +            finally:
          +                os.close(parent_fd)
          +
          +        try:
          +            with open_or_create_vault_directory(
          +                self.vault_root,
          +                parent_relative,
          +                create_missing=False,
          +            ) as parent_fd:
          +                return inspect_at(parent_fd)
          +        except VaultAccessError as exc:
          +            if exc.code == "not-found":
          +                return None
          +            raise PathSafetyError(
          +                f"Target {rel_path} cannot be inspected safely"
          +            ) from exc
          +
               @contextmanager
               def _target_parent(
                   self, rel_path: str, *, create_missing: bool
          @@ -352,16 +393,24 @@ class GeneratedOwnership:
                   new_hash = hashlib.sha256(content).hexdigest()
           
                   existing_entry = self._entries.get(rel_path)
          -        observation = self._observe_existing_target(rel_path)
          +        target_metadata = self._inspect_target_metadata(rel_path)
          +        observation: VaultFileObservation | None = None
           
          -        if observation is not None:
          +        if target_metadata is not None:
                       if not existing_entry:
                           raise UnownedFileError(f"Target {rel_path} exists but is unowned")
                       if existing_entry.generator_id != generator_id:
                           raise GeneratorMismatchError(
                               f"Target owned by {existing_entry.generator_id}, not {generator_id}"
                           )
          +            if not stat.S_ISREG(target_metadata.st_mode):
          +                raise PathSafetyError(f"Target {rel_path} cannot be inspected safely")
           
          +            observation = self._observe_existing_target(rel_path)
          +            if observation is None:
          +                raise ExternalModificationError(
          +                    f"Target {rel_path} changed while it was being verified"
          +                )
                       if observation.content_hash != existing_entry.content_hash:
                           raise ExternalModificationError(f"Target {rel_path} has been modified externally")
           
          diff --git a/tests/ownership/test_manifest_authorization_order.py b/tests/ownership/test_manifest_authorization_order.py
          new file mode 100644
          index 0000000..c5bc3d0
          --- /dev/null
          +++ b/tests/ownership/test_manifest_authorization_order.py
          @@ -0,0 +1,77 @@
          +import os
          +from pathlib import Path
          +
          +import pytest
          +
          +import lifeos.ownership.manifest as ownership_manifest
          +from lifeos.ownership import GeneratorMismatchError, GeneratedOwnership, UnownedFileError
          +
          +
          +def _vault(tmp_path: Path) -> Path:
          +    vault_root = tmp_path / "vault"
          +    vault_root.mkdir()
          +    return vault_root
          +
          +
          +def _forbid_content_observation(*_args: object, **_kwargs: object) -> None:
          +    raise AssertionError("unauthorized target contents must not be observed")
          +
          +
          +def test_unowned_target_is_rejected_before_content_observation(
          +    tmp_path: Path, monkeypatch: pytest.MonkeyPatch
          +) -> None:
          +    vault_root = _vault(tmp_path)
          +    ownership = GeneratedOwnership.load(tmp_path / "manifest.json", vault_root)
          +    target = vault_root / "human.md"
          +    target.write_bytes(b"private human content")
          +
          +    monkeypatch.setattr(
          +        ownership_manifest,
          +        "observe_vault_file",
          +        _forbid_content_observation,
          +    )
          +
          +    with pytest.raises(UnownedFileError, match="exists but is unowned"):
          +        ownership.write_generated_file("human.md", b"generated", "gen", "1")
          +
          +    assert target.read_bytes() == b"private human content"
          +
          +
          +def test_generator_mismatch_is_rejected_before_content_observation(
          +    tmp_path: Path, monkeypatch: pytest.MonkeyPatch
          +) -> None:
          +    vault_root = _vault(tmp_path)
          +    ownership = GeneratedOwnership.load(tmp_path / "manifest.json", vault_root)
          +    ownership.write_generated_file("owned.md", b"v1", "gen-a", "1")
          +    original_entry = ownership.entries["owned.md"]
          +
          +    monkeypatch.setattr(
          +        ownership_manifest,
          +        "observe_vault_file",
          +        _forbid_content_observation,
          +    )
          +
          +    with pytest.raises(GeneratorMismatchError, match="owned by gen-a, not gen-b"):
          +        ownership.write_generated_file("owned.md", b"v2", "gen-b", "2")
          +
          +    assert (vault_root / "owned.md").read_bytes() == b"v1"
          +    assert ownership.entries["owned.md"] == original_entry
          +
          +
          +@pytest.mark.skipif(not hasattr(os, "mkfifo"), reason="FIFO creation is unavailable")
          +def test_unowned_fifo_preserves_unowned_error_without_content_observation(
          +    tmp_path: Path, monkeypatch: pytest.MonkeyPatch
          +) -> None:
          +    vault_root = _vault(tmp_path)
          +    ownership = GeneratedOwnership.load(tmp_path / "manifest.json", vault_root)
          +    target = vault_root / "human.pipe"
          +    os.mkfifo(target)
          +
          +    monkeypatch.setattr(
          +        ownership_manifest,
          +        "observe_vault_file",
          +        _forbid_content_observation,
          +    )
          +
          +    with pytest.raises(UnownedFileError, match="exists but is unowned"):
          +        ownership.write_generated_file("human.pipe", b"generated", "gen", "1")
          PATCH
          git apply --check /tmp/lifeos-1668.patch
          git apply /tmp/lifeos-1668.patch
          test "$(git hash-object src/lifeos/ownership/manifest.py)" = "b707a88aa82fb7277611627a5d658f7e416d6199"
          test "$(git hash-object tests/ownership/test_manifest_authorization_order.py)" = "c5bc3d0aa73cbcf09cd674e1c04d99a3ef251799"
          git diff --check
      - name: Commit and push fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lifeos/ownership/manifest.py tests/ownership/test_manifest_authorization_order.py
          git commit -m "LIFEOS-1668 authorize before target content observation"
          git push origin HEAD:lifeos-1668-harden-generated-ownership-fs
