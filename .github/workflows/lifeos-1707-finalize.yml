name: LIFEOS-1707 finalize implementation

on:
  push:
    branches: [lifeos-1707-personal-model-context]

permissions:
  contents: write

jobs:
  finalize:
    if: "${{ github.event.head_commit.message != 'LIFEOS-1707: finalize context contract and docs' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lifeos-1707-personal-model-context
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.0'
          enable-cache: true
      - name: Apply compatibility and documentation updates
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {text.count(old)}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/lifeos/context/packs.py',
              '    from lifeos.retrieval import RetrievalScope\n',
              '    from lifeos.retrieval import RetrievalError, RetrievalScope\n',
          )
          replace_once(
              'src/lifeos/context/packs.py',
              '''    archived_patterns = archived_personal_pattern_paths_for_scope(\n        vault_root=vault_root,\n        mode=cast(Literal["local", "external"], retrieval_mode),\n        retrieval_scope=scope,\n        explicit_paths=focus_paths,\n    )\n''',
              '''    try:\n        archived_patterns = archived_personal_pattern_paths_for_scope(\n            vault_root=vault_root,\n            mode=cast(Literal["local", "external"], retrieval_mode),\n            retrieval_scope=scope,\n            explicit_paths=focus_paths,\n        )\n    except RetrievalError as exc:\n        raise ContextSearchExecutionError("Retrieval policy is invalid") from exc\n''',
          )

          replace_once(
              'docs/personal-model-architecture.md',
              '''The aggregate Personal Model is never injected wholesale into every provider request. Relevance and size are bounded for the question at hand, and local deterministic operation remains possible without a model provider.\n''',
              '''The aggregate Personal Model is never injected wholesale into every provider request. Relevance and size are bounded for the question at hand, and local deterministic operation remains possible without a model provider.\n\nLIFEOS-1707 makes that boundary concrete through `build_personal_pattern_context()`. The typed read contract carries the canonical pattern ID, path and content hash, lifecycle status, confidence, evidence health and fingerprint, and at most three canonical evidence references. Each item is explicitly marked `evidence-not-instruction` with `can_authorize_mutation: false`. Lifecycle meaning remains visible as `reviewed-working-hypothesis` for `active`, `exploratory-hypothesis` for `seed`, `uncertain-needs-review` for `needs-review`, and `archived-history` only when an archived pattern is explicitly referenced.\n\nContext Packs reuse their existing source bound and relevance ranking rather than appending a second Personal Model payload. A selected pattern source receives the evidence envelope above, while ordinary archived patterns are removed from candidate scope before retrieval. Knowledge conversations reuse those bounded excerpts; goal-to-plan clarification adds only relevant pattern evidence without changing readiness or planner selection; experiment previews apply the same provider-scope and redaction rules; canonical daily and weekly review items continue to expose their existing bounded pattern evidence and source explanations.\n''',
          )

          replace_once(
              'docs/architecture.md',
              '''Instruction applicability is evaluated against the final selected source set and grants no\nmutation authority.\n''',
              '''Instruction applicability is evaluated against the final selected source set and grants no\nmutation authority.\n\nRecognized `patterns/*.md` artifacts participate through the same bounded source selection rather\nthan through a universal profile prompt. Selected patterns are accompanied by typed Personal Model\nevidence containing lifecycle status, confidence, evidence health, canonical hashes/references, and\nan explicit `evidence-not-instruction` role. `needs-review` remains visibly uncertain, `seed` remains\nexploratory, and archived patterns are excluded before ordinary candidate ranking unless they are\nexplicit focus paths. `ContextPack.personal_patterns` exposes the same bounded metadata to typed\ncallers. Pattern text cannot become a routed instruction or authorize mutation.\n''',
          )

          replace_once(
              'docs/user-manual/11-semantic-retrieval-and-knowledge-conversations.md',
              '''When no embedding provider is configured, exact, lexical, metadata, link, and\ngraph retrieval still work. The workspace remains useful in local-only mode.\n\n## Read evidence before the answer\n''',
              '''When no embedding provider is configured, exact, lexical, metadata, link, and\ngraph retrieval still work. The workspace remains useful in local-only mode.\n\n## Personal-pattern evidence\n\nRelevant canonical notes under `patterns/` can appear in the same bounded evidence set when their\ncontent matches the current question or when you explicitly focus one. LifeOS does not send a\ncomplete personal profile with every query. A pattern evidence card keeps its canonical pattern ID\nand path, lifecycle status, confidence, evidence health, and bounded source references visible.\n\nThe lifecycle label matters when reading an answer: **active** is a reviewed working hypothesis,\n**seed** is exploratory, **needs-review** is explicitly uncertain, and **archived** is omitted from\nordinary retrieval unless you explicitly ask for or focus that historical pattern. Pattern text is\nevidence only. Even imperative-looking text inside a pattern cannot become a LifeOS instruction,\napprove a change, alter planner ranking, or authorize a mutation.\n\nThe same evidence boundary is reused by knowledge conversations, goal clarification, experiment\ncontext, and review explanations. Protected-scope policy still runs before content access. When an\nexternal provider is involved, existing explicit-grant, redaction, and disclosure rules apply to\npattern evidence exactly as they do to other canonical notes. Without a provider, the bounded\npattern evidence remains available to local retrieval and evidence-only flows.\n\n## Read evidence before the answer\n''',
          )
          PY
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra mcp
      - name: Validate stabilized implementation
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          uv run pytest -q tests/patterns/test_context_integration.py tests/context/test_hybrid_context_second_review.py::test_invalid_retrieval_policy_remains_execution_error tests/context/test_hybrid_context_security_review.py::test_hybrid_health_prunes_protected_subtree_before_metadata_access
          uv run pytest -q
          uv run ruff check src tests
          uv run mypy src
          git diff --check
      - name: Commit stabilized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lifeos/context/packs.py docs/personal-model-architecture.md docs/architecture.md docs/user-manual/11-semantic-retrieval-and-knowledge-conversations.md
          git commit -m "LIFEOS-1707: finalize context contract and docs"
          git push origin HEAD:lifeos-1707-personal-model-context
