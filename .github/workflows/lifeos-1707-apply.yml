          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one replacement anchor in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1))

          # Export the typed Personal Model context contract.
          replace_once(
              "src/lifeos/patterns/__init__.py",
              "from .evidence import (\n",
              "from .context import (\n"
              "    DEFAULT_PERSONAL_PATTERN_CONTEXT_LIMIT,\n"
              "    PersonalPatternContext,\n"
              "    PersonalPatternContextError,\n"
              "    PersonalPatternContextItem,\n"
              "    PersonalPatternContextOmission,\n"
              "    PersonalPatternContextReference,\n"
              "    archived_personal_pattern_paths_for_scope,\n"
              "    build_personal_pattern_context,\n"
