          replace_once(
              "src/lifeos/context/packs.py",
              "    sources = (*focused, *candidates[:remaining])\n    instruction_report = load_instruction_report(\n",
              "    sources = (*focused, *candidates[:remaining])\n"
              "    pattern_context_items: tuple[PersonalPatternContextItem, ...] = ()\n"
              "    pattern_context_omissions: tuple[str, ...] = ()\n"
