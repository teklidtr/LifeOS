name: LIFEOS-1707 invariant consolidation

on:
  push:
    branches: [lifeos-1707-personal-model-context]

permissions:
  contents: write

jobs:
  consolidate-and-validate:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'LIFEOS-1707: stage invariant consolidation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lifeos-1707-personal-model-context
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Apply centralized invariant fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = "src/lifeos/patterns/context.py"
          replace_once(path, "import re\n", "import os\nimport re\nimport sqlite3\n")
          replace_once(
              path,
              "from lifeos.registry import Registry, register_scan\n",
              "from lifeos.registry import FileTrackingError, Registry, RegistryError, register_scan\n",
          )
          replace_once(
              path,
              "from lifeos.scanner import scan_vault\n",
              "from lifeos.scanner import ScannerError, scan_vault\n",
          )
          replace_once(
              path,
              '''DEFAULT_PERSONAL_PATTERN_CONTEXT_LIMIT = 4\nPERSONAL_PATTERN_REFERENCE_LIMIT = 3\nPERSONAL_PATTERN_STATEMENT_MAX_CHARS = 600\nPERSONAL_PATTERN_RENDER_MAX_CHARS = 1_200\n''',
              '''DEFAULT_PERSONAL_PATTERN_CONTEXT_LIMIT = 4\nPERSONAL_PATTERN_REFERENCE_LIMIT = 3\nPERSONAL_PATTERN_TITLE_MAX_CHARS = 240\nPERSONAL_PATTERN_STATEMENT_MAX_CHARS = 600\nPERSONAL_PATTERN_RENDER_MAX_CHARS = 1_200\n''',
          )
          replace_once(
              path,
              '''def _document(\n    *,\n    vault_root: Path,\n    runtime_dir: Path,\n    allow_path: Callable[[str], bool],\n) -> PersonalModelDocument:\n    del runtime_dir\n    with TemporaryDirectory(prefix="lifeos-personal-model-context-") as temporary:\n        registry = Registry(Path(temporary) / "registry.db")\n        registry.initialize()\n        register_scan(\n            registry,\n            vault_root,\n            scan_vault(vault_root, path_filter=allow_path),\n            identity_allow_path=allow_path,\n        )\n        return build_personal_model_document(\n            vault_root=vault_root,\n            registry=registry,\n            allow_path=allow_path,\n        )\n''',
              '''def _runtime_scan_filter(\n    vault_root: Path, runtime_dir: Path\n) -> Callable[[str], bool]:\n    root = Path(os.path.abspath(os.fspath(vault_root)))\n    runtime = Path(os.path.abspath(os.fspath(runtime_dir)))\n    try:\n        relative_runtime = runtime.relative_to(root)\n    except ValueError:\n        return lambda _path: True\n    if relative_runtime == Path("."):\n        raise PersonalPatternContextError(\n            "Personal Model runtime directory cannot overlap the canonical vault root"\n        )\n    prefix = relative_runtime.as_posix().rstrip("/")\n\n    def allowed(path: str) -> bool:\n        candidate = path.rstrip("/")\n        return candidate != prefix and not candidate.startswith(prefix + "/")\n\n    return allowed\n\n\ndef _snapshot_registry(*, runtime_dir: Path, temporary: str) -> Registry:\n    snapshot = Registry(Path(temporary) / "registry.db")\n    snapshot.initialize()\n    source = Registry(runtime_dir / "registry.db")\n    try:\n        if source.schema_version:\n            with source.connect_read_only() as source_connection:\n                with snapshot.connect() as snapshot_connection:\n                    source_connection.backup(snapshot_connection)\n    except (RegistryError, sqlite3.Error) as exc:\n        raise PersonalPatternContextError(\n            f"Could not snapshot registry history for Personal Model context: {exc}"\n        ) from exc\n    return snapshot\n\n\ndef _document(\n    *,\n    vault_root: Path,\n    runtime_dir: Path,\n    allow_path: Callable[[str], bool],\n) -> PersonalModelDocument:\n    with TemporaryDirectory(prefix="lifeos-personal-model-context-") as temporary:\n        registry = _snapshot_registry(runtime_dir=runtime_dir, temporary=temporary)\n        try:\n            entries = scan_vault(\n                vault_root,\n                path_filter=_runtime_scan_filter(vault_root, runtime_dir),\n            )\n            register_scan(\n                registry,\n                vault_root,\n                entries,\n                identity_allow_path=allow_path,\n            )\n            return build_personal_model_document(\n                vault_root=vault_root,\n                registry=registry,\n                allow_path=allow_path,\n            )\n        except (FileTrackingError, RegistryError, ScannerError) as exc:\n            raise PersonalPatternContextError(\n                f"Could not refresh scoped registry facts for Personal Model context: {exc}"\n            ) from exc\n''',
          )
          replace_once(
              path,
              '''def _statement(vault_root: Path, item: PersonalModelItem) -> str:\n''',
              '''def _merge_redactions(\n    *groups: tuple[dict[str, object], ...],\n) -> tuple[dict[str, object], ...]:\n    counts: dict[str, int] = {}\n    for group in groups:\n        for entry in group:\n            label = str(entry["label"])\n            counts[label] = counts.get(label, 0) + int(entry["occurrences"])\n    return tuple(\n        {"label": label, "occurrences": counts[label]}\n        for label in sorted(counts)\n    )\n\n\ndef _statement(vault_root: Path, item: PersonalModelItem) -> str:\n''',
          )
          replace_once(
              path,
              '''def _references(item: PersonalModelItem) -> tuple[PersonalPatternContextReference, ...]:\n    ordered = sorted(\n        item.evidence_diagnostics,\n        key=lambda diagnostic: (\n            diagnostic.reference.role,\n            diagnostic.reference.path,\n            diagnostic.reference.content_hash,\n        ),\n    )\n    return tuple(\n        PersonalPatternContextReference(\n            role=diagnostic.reference.role,\n            state=diagnostic.state,\n            reviewed_path=diagnostic.reference.path,\n            reviewed_content_hash=diagnostic.reference.content_hash,\n            current_path=diagnostic.current_path,\n            current_content_hash=diagnostic.current_content_hash,\n        )\n        for diagnostic in ordered[:PERSONAL_PATTERN_REFERENCE_LIMIT]\n    )\n''',
              '''def _references(\n    item: PersonalModelItem, terms: tuple[str, ...]\n) -> tuple[\n    tuple[PersonalPatternContextReference, ...],\n    tuple[dict[str, object], ...],\n]:\n    ordered = sorted(\n        item.evidence_diagnostics,\n        key=lambda diagnostic: (\n            diagnostic.reference.role,\n            diagnostic.reference.path,\n            diagnostic.reference.content_hash,\n        ),\n    )\n    references: list[PersonalPatternContextReference] = []\n    redaction_groups: list[tuple[dict[str, object], ...]] = []\n    for diagnostic in ordered[:PERSONAL_PATTERN_REFERENCE_LIMIT]:\n        reviewed_path, reviewed_redactions = _redact(diagnostic.reference.path, terms)\n        if diagnostic.current_path is None:\n            current_path = None\n            current_redactions: tuple[dict[str, object], ...] = ()\n        else:\n            current_path, current_redactions = _redact(diagnostic.current_path, terms)\n        references.append(\n            PersonalPatternContextReference(\n                role=diagnostic.reference.role,\n                state=diagnostic.state,\n                reviewed_path=reviewed_path,\n                reviewed_content_hash=diagnostic.reference.content_hash,\n                current_path=current_path,\n                current_content_hash=diagnostic.current_content_hash,\n            )\n        )\n        redaction_groups.extend((reviewed_redactions, current_redactions))\n    return tuple(references), _merge_redactions(*redaction_groups)\n''',
          )
          replace_once(
              path,
              '''    document = _document(vault_root=vault_root, runtime_dir=runtime_dir, allow_path=allow_path)\n    by_path = {item.pattern_path: item for item in document.items}\n\n    if candidate_paths is None:\n        search = lexical_search_report(\n            vault_root=vault_root,\n            query=normalized_question,\n            limit=max(16, limit * 4),\n            path_prefix="patterns",\n            path_filter=allow_path,\n        )\n''',
              '''    document = _document(vault_root=vault_root, runtime_dir=runtime_dir, allow_path=allow_path)\n    by_path = {item.pattern_path: item for item in document.items}\n    archived_default_paths = frozenset(\n        item.pattern_path\n        for item in document.archived\n        if item.pattern_path not in explicit\n    )\n\n    if candidate_paths is None:\n        def search_allow_path(path: str) -> bool:\n            return allow_path(path) and path not in archived_default_paths\n\n        search = lexical_search_report(\n            vault_root=vault_root,\n            query=normalized_question,\n            limit=max(16, limit * 4),\n            path_prefix="patterns",\n            path_filter=search_allow_path,\n        )\n''',
          )
          replace_once(
              path,
              '''        statement, applied = _redact(\n            _bounded_text(\n                _statement(vault_root, model_item),\n                limit=PERSONAL_PATTERN_STATEMENT_MAX_CHARS,\n            ),\n            redactions,\n        )\n        items.append(\n            PersonalPatternContextItem(\n                pattern_id=model_item.pattern_id,\n                pattern_path=model_item.pattern_path,\n                pattern_content_hash=model_item.pattern_content_hash,\n                title=model_item.title,\n                statement=statement,\n                status=model_item.status,\n                confidence=model_item.confidence,\n                evidence_health=model_item.evidence_health,\n                evidence_fingerprint=model_item.evidence_fingerprint,\n                interpretation=_INTERPRETATION_BY_STATUS[model_item.status],\n                references=_references(model_item),\n                redactions=applied,\n            )\n        )\n''',
              '''        title, title_redactions = _redact(\n            _bounded_text(model_item.title, limit=PERSONAL_PATTERN_TITLE_MAX_CHARS),\n            redactions,\n        )\n        statement, statement_redactions = _redact(\n            _bounded_text(\n                _statement(vault_root, model_item),\n                limit=PERSONAL_PATTERN_STATEMENT_MAX_CHARS,\n            ),\n            redactions,\n        )\n        references, reference_redactions = _references(model_item, redactions)\n        items.append(\n            PersonalPatternContextItem(\n                pattern_id=model_item.pattern_id,\n                pattern_path=model_item.pattern_path,\n                pattern_content_hash=model_item.pattern_content_hash,\n                title=title,\n                statement=statement,\n                status=model_item.status,\n                confidence=model_item.confidence,\n                evidence_health=model_item.evidence_health,\n                evidence_fingerprint=model_item.evidence_fingerprint,\n                interpretation=_INTERPRETATION_BY_STATUS[model_item.status],\n                references=references,\n                redactions=_merge_redactions(\n                    title_redactions, statement_redactions, reference_redactions\n                ),\n            )\n        )\n''',
          )

          path = "src/lifeos/copilot/context.py"
          replace_once(
              path,
              '''    try:\n        pattern_context = build_personal_pattern_context(\n            vault_root=vault_root,\n            runtime_dir=vault_root / ".lifeos",\n            question=pattern_query,\n            limit=3,\n            mode="external",\n        )\n''',
              '''    def pattern_context_path_filter(path: str) -> bool:\n        if path in excludes:\n            return False\n        root = path.split("/", 1)[0]\n        return root not in policy.sensitive_roots\n\n    try:\n        pattern_context = build_personal_pattern_context(\n            vault_root=vault_root,\n            runtime_dir=vault_root / ".lifeos",\n            question=pattern_query,\n            limit=3,\n            mode="external",\n            redact_terms=redactions,\n            path_filter=pattern_context_path_filter,\n        )\n''',
          )

          path = "src/lifeos/experiments/privacy.py"
          replace_once(path, "import re\n", "import json\nimport re\n")
          replace_once(
              path,
              '''    def to_dict(self) -> dict[str, object]:\n        return {**asdict(self), "redactions": [dict(item) for item in self.redactions]}\n''',
              '''    def to_dict(self) -> dict[str, object]:\n        return {\n            "path": self.path,\n            "content_hash": self.content_hash,\n            "inclusion_reason": self.inclusion_reason,\n            "excerpt": self.excerpt,\n            "byte_count": self.byte_count,\n            "included_bytes": self.included_bytes,\n            "truncated": self.truncated,\n            "redactions": [dict(item) for item in self.redactions],\n            "personal_pattern": (\n                self.personal_pattern.to_dict()\n                if self.personal_pattern is not None\n                else None\n            ),\n        }\n''',
          )
          replace_once(
              path,
              '''def _truncate(text: str, limit: int) -> tuple[str, int, bool]:\n''',
              '''def _personal_pattern_bytes(item: PersonalPatternContextItem | None) -> int:\n    if item is None:\n        return 0\n    encoded = json.dumps(\n        item.to_dict(),\n        ensure_ascii=False,\n        sort_keys=True,\n        separators=(",", ":"),\n    ).encode("utf-8")\n    return len(encoded)\n\n\ndef _truncate(text: str, limit: int) -> tuple[str, int, bool]:\n''',
          )
          replace_once(
              path,
              '''        visible, applied = _redact(context_text, redactions)\n        raw_bytes = len(visible.encode("utf-8"))\n        allowance = min(max_item_bytes, remaining)\n        if allowance <= 0:\n            omissions.append(\n                ExperimentContextOmission(\n                    path, "context-budget-exhausted", "The bounded context budget was reached."\n                )\n            )\n            truncated = True\n            continue\n        excerpt, included_bytes, item_truncated = _truncate(visible, allowance)\n        truncated = truncated or item_truncated\n''',
              '''        visible, applied = _redact(context_text, redactions)\n        pattern_bytes = _personal_pattern_bytes(pattern_item)\n        raw_bytes = len(visible.encode("utf-8")) + pattern_bytes\n        allowance = min(max_item_bytes, remaining)\n        if allowance <= pattern_bytes:\n            omissions.append(\n                ExperimentContextOmission(\n                    path, "context-budget-exhausted", "The bounded context budget was reached."\n                )\n            )\n            truncated = True\n            continue\n        excerpt, excerpt_bytes, item_truncated = _truncate(\n            visible, allowance - pattern_bytes\n        )\n        included_bytes = excerpt_bytes + pattern_bytes\n        truncated = truncated or item_truncated\n''',
          )

          path = "tests/patterns/test_context_integration.py"
          replace_once(
              path,
              '''from lifeos.patterns import context as pattern_context_module\nfrom lifeos.patterns import (\n''',
              '''from lifeos.patterns import context as pattern_context_module\nfrom lifeos.patterns import (\n''',
          )
          replace_once(
              path,
              '''    description: str = "Sleep recovery evidence.",\n    evidence: tuple[PatternEvidence, ...] = (),\n) -> str:\n''',
              '''    description: str = "Sleep recovery evidence.",\n    title: str | None = None,\n    evidence: tuple[PatternEvidence, ...] = (),\n) -> str:\n''',
          )
          replace_once(
              path,
              '''        title=f"Sleep {name}",\n''',
              '''        title=title or f"Sleep {name}",\n''',
          )
          replace_once(
              path,
              '''    _pattern(\n        vault,\n        "experiment",\n        status="seed",\n        statement="SecretName sleep timing may affect focus.",\n    )\n''',
              '''    source = "SecretName source evidence."\n    _write(vault, "notes/SecretName-source.md", source)\n    evidence = (\n        PatternEvidence(\n            path="notes/SecretName-source.md",\n            content_hash=_digest(source),\n            role="supporting",\n        ),\n    )\n    _pattern(\n        vault,\n        "experiment",\n        status="seed",\n        title="SecretName sleep experiment",\n        statement="SecretName sleep timing may affect focus.",\n        evidence=evidence,\n    )\n''',
          )
          replace_once(
              path,
              '''    assert "[REDACTED-1]" in item.personal_pattern.statement\n    assert item.redactions\n''',
              '''    assert "[REDACTED-1]" in item.personal_pattern.statement\n    assert "SecretName" not in item.personal_pattern.title\n    assert "SecretName" not in item.personal_pattern.references[0].reviewed_path\n    assert item.redactions\n    assert item.included_bytes <= 8_000\n''',
          )
          replace_once(
              path,
              '''    _pattern(\n        vault,\n        "large",\n        status="active",\n        statement="sleep " + ("x" * 5_000),\n    )\n''',
              '''    _pattern(\n        vault,\n        "large",\n        status="active",\n        title="Sleep " + ("z" * 5_000),\n        statement="sleep " + ("x" * 5_000),\n    )\n''',
          )
          replace_once(
              path,
              '''    assert len(item.statement) <= pattern_context_module.PERSONAL_PATTERN_STATEMENT_MAX_CHARS\n    assert len(rendered) <= pattern_context_module.PERSONAL_PATTERN_RENDER_MAX_CHARS\n    assert "Canonical pattern: patterns/large.md" in rendered\n''',
              '''    assert len(item.title) <= pattern_context_module.PERSONAL_PATTERN_TITLE_MAX_CHARS\n    assert len(item.statement) <= pattern_context_module.PERSONAL_PATTERN_STATEMENT_MAX_CHARS\n    assert len(rendered) <= pattern_context_module.PERSONAL_PATTERN_RENDER_MAX_CHARS\n    assert "Canonical pattern: patterns/large.md" in rendered\n\n\ndef test_planning_exclusions_apply_before_personal_pattern_ranking(tmp_path: Path) -> None:\n    vault = _vault(tmp_path)\n    excluded = tuple(\n        _pattern(\n            vault,\n            f"aa-excluded-{index}",\n            status="active",\n            statement="Sleep recovery consistency evidence.",\n        )\n        for index in range(3)\n    )\n    allowed = _pattern(\n        vault,\n        "zz-allowed",\n        status="active",\n        statement="Sleep recovery consistency evidence.",\n    )\n    goal_text = "---\\nid: goal-filter\\ntype: goal\\ntitle: Improve sleep recovery\\n---\\nGoal\\n"\n    _write(vault, "goals/filter.md", goal_text)\n    goal = GoalRecord(\n        schema_version=1,\n        goal_id="goal-filter",\n        title="Improve sleep recovery",\n        status="active",\n        path="goals/filter.md",\n        content_hash=_digest(goal_text),\n        description="Improve sleep recovery consistency.",\n        readiness="clarifying",\n    )\n\n    context = build_planning_context(\n        vault_root=vault,\n        goal=goal,\n        index=CopilotIndex((goal,), (), ()),\n        exclude_paths=excluded,\n    )\n\n    assert allowed in {item.path for item in context.items}\n    assert not set(excluded) & {item.path for item in context.items}\n\n\ndef test_personal_pattern_context_excludes_archived_before_rank_cap(tmp_path: Path) -> None:\n    vault = _vault(tmp_path)\n    for index in range(20):\n        _pattern(\n            vault,\n            f"aa-archive-{index:02d}",\n            status="archived",\n            statement="Sleep recovery pattern evidence.",\n        )\n    active = _pattern(\n        vault,\n        "zz-active",\n        status="active",\n        statement="Sleep recovery pattern evidence.",\n    )\n\n    context = build_personal_pattern_context(\n        vault_root=vault,\n        runtime_dir=vault / ".lifeos",\n        question="sleep recovery pattern evidence",\n        limit=1,\n    )\n\n    assert [item.pattern_path for item in context.items] == [active]\n''',
          )
          # Add registry-history regression imports and test last so normal contexts without a registry remain covered.
          replace_once(
              path,
              '''from lifeos.patterns import (\n    PatternEvidence,\n''',
              '''from lifeos.patterns import (\n    PatternEvidence,\n''',
          )
          text = Path(path).read_text(encoding="utf-8")
          insert = '''\n\ndef test_personal_pattern_context_preserves_registry_deleted_state(tmp_path: Path) -> None:\n    from lifeos.registry import Registry, register_scan\n    from lifeos.scanner import scan_vault\n\n    vault = _vault(tmp_path)\n    runtime_dir = vault / ".lifeos"\n    runtime_dir.mkdir()\n    source = "---\\nid: source-sleep\\n---\\nReviewed sleep evidence.\\n"\n    _write(vault, "notes/source.md", source)\n    evidence = (\n        PatternEvidence(\n            path="notes/source.md",\n            source_id="source-sleep",\n            content_hash=_digest(source),\n            role="supporting",\n        ),\n    )\n    _pattern(\n        vault,\n        "history",\n        status="active",\n        statement="Sleep evidence has historical lineage.",\n        evidence=evidence,\n    )\n    registry = Registry(runtime_dir / "registry.db")\n    registry.initialize()\n    register_scan(registry, vault, scan_vault(vault))\n    (vault / "notes/source.md").unlink()\n    register_scan(registry, vault, scan_vault(vault))\n\n    context = build_personal_pattern_context(\n        vault_root=vault,\n        runtime_dir=runtime_dir,\n        question="sleep evidence historical lineage",\n    )\n\n    assert context.items[0].references[0].state == "deleted"\n'''
          Path(path).write_text(text + insert, encoding="utf-8")

          path = "docs/personal-model-architecture.md"
          replace_once(
              path,
              '''Context Packs reuse their existing source bound and relevance ranking rather than appending a second Personal Model payload. A selected pattern source receives the evidence envelope above, while ordinary archived patterns are removed from candidate scope before retrieval. Caller path filters are forwarded into both archived-pattern discovery and Personal Model evidence scans, and both the statement payload and rendered evidence envelope have explicit per-item character caps. Knowledge conversations reuse those bounded excerpts; goal-to-plan clarification adds only relevant pattern evidence without changing readiness or planner selection; experiment previews apply the same provider-scope and redaction rules to both rendered excerpts and nested typed pattern metadata; canonical daily and weekly review items continue to expose their existing bounded pattern evidence and source explanations.\n''',
              '''Context Packs reuse their existing source bound and relevance ranking rather than appending a second Personal Model payload. A selected pattern source receives the evidence envelope above, while ordinary archived patterns are removed before capped relevance ranking. Caller path filters and planning exclusions are enforced before Personal Model content access, and the typed title, statement, reference set, and rendered evidence envelope remain bounded. Redaction is applied inside typed pattern metadata, including the human-readable title and bounded evidence-reference paths, before serialization. Evidence-state resolution uses a disposable snapshot of the persisted node-local registry history and refreshes that snapshot inside the caller's scope; tombstones can therefore distinguish `deleted` from `missing` without mutating the runtime registry or making SQLite authoritative. Knowledge conversations reuse those bounded excerpts; goal-to-plan clarification adds only relevant pattern evidence without changing readiness or planner selection; experiment previews apply the same provider-scope, redaction, and byte-budget rules to both rendered excerpts and nested typed pattern metadata; canonical daily and weekly review items continue to expose their existing bounded pattern evidence and source explanations.\n''',
          )
          PY
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra mcp
      - name: Validate consolidated implementation
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          uv run pytest -q tests/patterns/test_context_integration.py
          uv run pytest -q
          uv run ruff check src tests
          uv run mypy src
          git diff --check
      - name: Commit consolidated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lifeos/patterns/context.py src/lifeos/copilot/context.py src/lifeos/experiments/privacy.py tests/patterns/test_context_integration.py docs/personal-model-architecture.md
          git commit -m "LIFEOS-1707: consolidate context privacy and bounds"
          git push origin HEAD:lifeos-1707-personal-model-context
