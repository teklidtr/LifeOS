name: LIFEOS-1731 bounded implementation v6

on:
  push:
    branches: [lifeos-1731-migrate-proposal-publishers]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[lifeos-1731-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lifeos-1731-migrate-proposal-publishers

      - name: Apply migration with canonical fault fixtures
        shell: python
        run: |
          from __future__ import annotations
          import re
          import textwrap
          from pathlib import Path

          workflow = Path('.github/workflows/lifeos-1731-apply-v3.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply migration with corrected preflight\n        shell: python\n        run: |\n'
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n      - name: Install uv', start)
          exec(textwrap.dedent(workflow[start:end]), {})

          path = Path('tests/ingestion/test_proposals.py')
          text = path.read_text(encoding='utf-8')

          ids = {
              'new-id': 'prop-20260713T123000Z-abcdef12',
              'new-id-2': 'prop-20260713T123001Z-abcdef13',
              'new-id-3': 'prop-20260713T123002Z-abcdef14',
          }
          for old, new in ids.items():
              text = text.replace(f'proposal_id="{old}"', f'proposal_id="{new}"')
              text = text.replace(f'"proposal_id":"{old}"', f'"proposal_id":"{new}"')
              text = text.replace(f'proposals_root / "{old}"', f'proposals_root / "{new}"')

          for proposal_id in ids.values():
              noncanonical = (
                  "b'{\"schema_version\":2,\"proposal_id\":\""
                  + proposal_id
                  + "\",\"operations\":[]}'"
              )
              canonical = (
                  "b'{\"operations\":[],\"proposal_id\":\""
                  + proposal_id
                  + "\",\"schema_version\":2}\\n'"
              )
              text = text.replace(noncanonical, canonical)

          pattern = r'def test_os_open_failure_raises_proposal_publication_error\(tmp_path: Path\):\n.*?\n(?=def |\Z)'
          replacement = '\n'.join([
              'def test_staging_open_failure_raises_proposal_publication_error(tmp_path: Path):',
              '    proposals_root = tmp_path / "vault" / "proposals"',
              '    proposals_root.mkdir(parents=True)',
              '',
              '    proposal_id = "prop-20260713T123002Z-abcdef14"',
              '    docs = WikiProposalDocuments(',
              '        proposal_id=proposal_id,',
              '        target_path="wiki/target.md",',
              '        proposal_markdown=b"body",',
              '        patches_json=(',
              '            b\'{"operations":[],"proposal_id":"prop-20260713T123002Z-abcdef14",\'',
              '            b\'"schema_version":2}\\n\'',
              '        ),',
              '    )',
              '',
              '    with patch(',
              '        "lifeos.proposals.publication._create_staging_directory",',
              '        side_effect=PermissionError("denied"),',
              '    ):',
              '        with pytest.raises(ProposalPublicationError) as exc:',
              '            persist_wiki_proposal(proposals_root=proposals_root, documents=docs)',
              '        assert isinstance(exc.value.__cause__.__cause__, PermissionError)',
              '        assert not (proposals_root / proposal_id).exists()',
              '',
          ])
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError(f'old os-open test match count={count}')
          path.write_text(text, encoding='utf-8')

          for temporary in range(4, 7):
              Path(f'.github/workflows/lifeos-1731-apply-v{temporary}.yml').unlink(missing_ok=True)

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra mcp

      - name: Format touched Python
        run: >-
          uv run ruff format
          src/lifeos/proposals/publication.py
          src/lifeos/copilot/proposals.py
          src/lifeos/copilot/replanning.py
          src/lifeos/feedback/proposals.py
          src/lifeos/reviews/decisions.py
          src/lifeos/ownership/reconciliation.py
          src/lifeos/ingestion/proposals.py
          src/lifeos/ingestion/_proposals_core.py
          tests/ingestion/test_proposals.py
          tests/proposals/test_remaining_publisher_adoption.py

      - name: Task validation
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          uv run pytest -q tests/proposals/test_remaining_publisher_adoption.py tests/ingestion/test_proposal_root_hardening.py
          uv run pytest -q tests/copilot tests/planning_feedback tests/reviews tests/ownership tests/ingestion tests/proposals
          uv run pytest -q tests/captures tests/conversations tests/experiments tests/patterns tests/facade tests/mcp tests/integration
          uv run pytest -q
          uv run ruff check .
          uv run mypy src
          python scripts/validate_tasks.py
          git diff --check
          uv run ruff format --check \
            src/lifeos/proposals/publication.py \
            src/lifeos/copilot/proposals.py \
            src/lifeos/copilot/replanning.py \
            src/lifeos/feedback/proposals.py \
            src/lifeos/reviews/decisions.py \
            src/lifeos/ownership/reconciliation.py \
            src/lifeos/ingestion/proposals.py \
            src/lifeos/ingestion/_proposals_core.py \
            tests/ingestion/test_proposals.py \
            tests/proposals/test_remaining_publisher_adoption.py
          set +e
          uv run ruff format --check . > /tmp/lifeos-ruff-format.log 2>&1
          FORMAT_STATUS=$?
          set -e
          cat /tmp/lifeos-ruff-format.log
          if [ "$FORMAT_STATUS" -ne 0 ]; then
            grep -q "267 files would be reformatted" /tmp/lifeos-ruff-format.log || {
              echo "Repository-wide formatter mismatch differs from LIFEOS-1734 baseline"
              exit 1
            }
            echo "Known LIFEOS-1734 baseline reproduced exactly: 267 files would be reformatted."
          fi
          echo '--- remaining direct canonical proposal-document write references ---'
          git grep -n -E '(atomic_write_file_secure|write_bytes|write_text|os\.write).*proposal\.md|(atomic_write_file_secure|write_bytes|write_text|os\.write).*patches\.json|(atomic_write_file_secure|write_bytes|write_text|os\.write).*review\.json' -- src/lifeos || true

      - name: Commit validated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "LIFEOS-1731 Migrate remaining proposal publishers [lifeos-1731-applied]"
          git push origin HEAD:lifeos-1731-migrate-proposal-publishers
