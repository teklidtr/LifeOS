name: Pytest benchmark

on:
  pull_request:
    branches: [master]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: pytest-benchmark-${{ github.event.pull_request.number }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  full-suite:
    if: ${{ github.event.label.name == 'pytest-benchmark' }}
    name: full-suite-${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            command: uv run pytest -q --durations=20
          - variant: xdist-2-load
            command: uv run --with pytest-xdist==3.8.0 pytest -q -n 2 --dist=load --durations=20
          - variant: xdist-2-worksteal
            command: uv run --with pytest-xdist==3.8.0 pytest -q -n 2 --dist=worksteal --durations=20
          - variant: xdist-auto-worksteal
            command: uv run --with pytest-xdist==3.8.0 pytest -q -n auto --dist=worksteal --durations=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra mcp
      - name: Run benchmark
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        shell: bash
        run: |
          echo "variant=${{ matrix.variant }}"
          /usr/bin/time -f 'wall=%e user=%U sys=%S maxrss_kb=%M' ${{ matrix.command }}

  split-suite:
    if: ${{ github.event.label.name == 'pytest-benchmark' }}
    name: split-4-group-${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra mcp
      - name: Run shard
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        shell: bash
        run: |
          /usr/bin/time -f 'wall=%e user=%U sys=%S maxrss_kb=%M' \
            uv run --with pytest-split==0.11.0 pytest -q \
              --splits 4 --group ${{ matrix.group }} \
              --splitting-algorithm=least_duration --durations=10

  testmon:
    if: ${{ github.event.label.name == 'pytest-benchmark' }}
    name: testmon
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra mcp
      - name: Restore testmon dependency database
        id: testmon-cache
        uses: actions/cache@v4
        with:
          path: .testmondata
          key: testmon-v1-${{ runner.os }}-${{ hashFiles('.python-version', 'uv.lock', 'pyproject.toml') }}-${{ github.event.pull_request.number }}-${{ github.sha }}
          restore-keys: |
            testmon-v1-${{ runner.os }}-${{ hashFiles('.python-version', 'uv.lock', 'pyproject.toml') }}-${{ github.event.pull_request.number }}-
      - name: Run affected tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        shell: bash
        run: |
          echo "testmon exact cache hit: ${{ steps.testmon-cache.outputs.cache-hit || 'false' }}"
          /usr/bin/time -f 'wall=%e user=%U sys=%S maxrss_kb=%M' \
            uv run --with pytest-testmon==2.2.0 pytest -q --testmon --durations=20
          ls -lh .testmondata || true
