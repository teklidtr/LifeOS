name: LIFEOS-1707 materialize implementation

on:
  push:
    branches: [lifeos-1707-personal-model-context]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lifeos-1707-personal-model-context
          fetch-depth: 0
      - name: Reuse integration apply step
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/lifeos-1707-apply.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == '- name: Apply bounded Personal Model context integration')
          run_line = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(workflow)) if workflow[i].strip() == '- name: Install uv')
          body = workflow[run_line + 1:end]
          nonblank = [len(line) - len(line.lstrip()) for line in body if line.strip()]
          indent = min(nonblank)
          Path('/tmp/lifeos-1707-apply.sh').write_text('\n'.join(line[indent:] if line.strip() else '' for line in body) + '\n')
          PY
          bash /tmp/lifeos-1707-apply.sh
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lifeos/patterns/context.py')
          text = path.read_text()
          old = '''from lifeos.vault import (\n    VaultAccessError,\n    iter_vault_markdown_paths,\n    read_vault_markdown,\n)\n'''
          new = '''from lifeos.vault import VaultAccessError, read_vault_markdown\nfrom lifeos.vault_paths import iter_vault_markdown_paths\n'''
          if text.count(old) != 1:
              raise SystemExit('expected generated vault import block')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit WIP implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "LIFEOS-1707: integrate personal patterns with reasoning context"
          git push origin HEAD:lifeos-1707-personal-model-context
