name: LIFEOS-1731 bounded implementation v7

on:
  push:
    branches: [lifeos-1731-migrate-proposal-publishers]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[lifeos-1731-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lifeos-1731-migrate-proposal-publishers

      - name: Apply migration with serializer-backed fault fixtures
        shell: python
        run: |
          from __future__ import annotations
          import re
          import textwrap
          from pathlib import Path

          workflow = Path('.github/workflows/lifeos-1731-apply-v3.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply migration with corrected preflight\n        shell: python\n        run: |\n'
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n      - name: Install uv', start)
          exec(textwrap.dedent(workflow[start:end]), {})

          path = Path('tests/ingestion/test_proposals.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import os\n', '', 1)
          import_marker = 'from lifeos.proposals.unified_diff import apply_diff\n'
          if text.count(import_marker) != 1:
              raise RuntimeError('proposal test import marker mismatch')
          text = text.replace(
              import_marker,
              'from lifeos.proposals.patches import PatchDocumentV2, serialize_patch_json_bytes\n'
              + import_marker,
              1,
          )

          tail_pattern = r'def test_publication_io_failure_raises_proposal_publication_error\(tmp_path: Path\):\n.*\Z'
          tail = '''def _empty_patch_bytes(proposal_id: str) -> bytes:\n    return serialize_patch_json_bytes(\n        PatchDocumentV2(schema_version=2, proposal_id=proposal_id, operations=())\n    )\n\n\ndef test_publication_io_failure_raises_proposal_publication_error(tmp_path: Path):\n    proposals_root = tmp_path / "vault" / "proposals"\n    proposals_root.mkdir(parents=True)\n    proposal_id = "prop-20260713T123000Z-abcdef12"\n    docs = WikiProposalDocuments(\n        proposal_id=proposal_id,\n        target_path="wiki/target.md",\n        proposal_markdown=b"body",\n        patches_json=_empty_patch_bytes(proposal_id),\n    )\n\n    with patch(\n        "lifeos.proposals.publication.atomic_write_file_secure",\n        side_effect=OSError("Disk full"),\n    ):\n        with pytest.raises(ProposalPublicationError) as exc:\n            persist_wiki_proposal(proposals_root=proposals_root, documents=docs)\n        assert "Failed to write proposal files: Disk full" in str(exc.value)\n        assert isinstance(exc.value.__cause__.__cause__, OSError)\n        assert not (proposals_root / proposal_id).exists()\n\n\ndef test_unexpected_write_programming_error_propagates(tmp_path: Path):\n    proposals_root = tmp_path / "vault" / "proposals"\n    proposals_root.mkdir(parents=True)\n    proposal_id = "prop-20260713T123000Z-abcdef12"\n    docs = WikiProposalDocuments(\n        proposal_id=proposal_id,\n        target_path="wiki/target.md",\n        proposal_markdown=b"body",\n        patches_json=_empty_patch_bytes(proposal_id),\n    )\n\n    with patch(\n        "lifeos.proposals.publication.atomic_write_file_secure",\n        side_effect=TypeError("Expected bytes"),\n    ):\n        with pytest.raises(TypeError, match="Expected bytes"):\n            persist_wiki_proposal(proposals_root=proposals_root, documents=docs)\n\n\ndef test_atomic_write_failure_raises_proposal_publication_error(tmp_path: Path):\n    proposals_root = tmp_path / "vault" / "proposals"\n    proposals_root.mkdir(parents=True)\n    proposal_id = "prop-20260713T123001Z-abcdef13"\n    docs = WikiProposalDocuments(\n        proposal_id=proposal_id,\n        target_path="wiki/target.md",\n        proposal_markdown=b"body",\n        patches_json=_empty_patch_bytes(proposal_id),\n    )\n\n    with patch(\n        "lifeos.proposals.publication.atomic_write_file_secure",\n        side_effect=OSError("Cannot open"),\n    ):\n        with pytest.raises(ProposalPublicationError) as exc:\n            persist_wiki_proposal(proposals_root=proposals_root, documents=docs)\n        assert "Failed to write proposal files: Cannot open" in str(exc.value)\n        assert isinstance(exc.value.__cause__.__cause__, OSError)\n        assert not (proposals_root / proposal_id).exists()\n\n\ndef test_staging_open_failure_raises_proposal_publication_error(tmp_path: Path):\n    proposals_root = tmp_path / "vault" / "proposals"\n    proposals_root.mkdir(parents=True)\n    proposal_id = "prop-20260713T123002Z-abcdef14"\n    docs = WikiProposalDocuments(\n        proposal_id=proposal_id,\n        target_path="wiki/target.md",\n        proposal_markdown=b"body",\n        patches_json=_empty_patch_bytes(proposal_id),\n    )\n\n    with patch(\n        "lifeos.proposals.publication._create_staging_directory",\n        side_effect=PermissionError("denied"),\n    ):\n        with pytest.raises(ProposalPublicationError) as exc:\n            persist_wiki_proposal(proposals_root=proposals_root, documents=docs)\n        assert "Failed to write proposal files: denied" in str(exc.value)\n        assert isinstance(exc.value.__cause__.__cause__, PermissionError)\n        assert not (proposals_root / proposal_id).exists()\n'''
          text, count = re.subn(tail_pattern, tail, text, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError(f'fault-test tail match count={count}')
          path.write_text(text, encoding='utf-8')

          for temporary in range(4, 8):
              Path(f'.github/workflows/lifeos-1731-apply-v{temporary}.yml').unlink(missing_ok=True)

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra mcp

      - name: Format touched Python
        run: >-
          uv run ruff format
          src/lifeos/proposals/publication.py
          src/lifeos/copilot/proposals.py
          src/lifeos/copilot/replanning.py
          src/lifeos/feedback/proposals.py
          src/lifeos/reviews/decisions.py
          src/lifeos/ownership/reconciliation.py
          src/lifeos/ingestion/proposals.py
          src/lifeos/ingestion/_proposals_core.py
          tests/ingestion/test_proposals.py
          tests/proposals/test_remaining_publisher_adoption.py

      - name: Task validation
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          uv run pytest -q tests/proposals/test_remaining_publisher_adoption.py tests/ingestion/test_proposal_root_hardening.py
          uv run pytest -q tests/copilot tests/planning_feedback tests/reviews tests/ownership tests/ingestion tests/proposals
          uv run pytest -q tests/captures tests/conversations tests/experiments tests/patterns tests/facade tests/mcp tests/integration
          uv run pytest -q
          uv run ruff check .
          uv run mypy src
          python scripts/validate_tasks.py
          git diff --check
          uv run ruff format --check \
            src/lifeos/proposals/publication.py \
            src/lifeos/copilot/proposals.py \
            src/lifeos/copilot/replanning.py \
            src/lifeos/feedback/proposals.py \
            src/lifeos/reviews/decisions.py \
            src/lifeos/ownership/reconciliation.py \
            src/lifeos/ingestion/proposals.py \
            src/lifeos/ingestion/_proposals_core.py \
            tests/ingestion/test_proposals.py \
            tests/proposals/test_remaining_publisher_adoption.py
          set +e
          uv run ruff format --check . > /tmp/lifeos-ruff-format.log 2>&1
          FORMAT_STATUS=$?
          set -e
          cat /tmp/lifeos-ruff-format.log
          if [ "$FORMAT_STATUS" -ne 0 ]; then
            grep -q "267 files would be reformatted" /tmp/lifeos-ruff-format.log || {
              echo "Repository-wide formatter mismatch differs from LIFEOS-1734 baseline"
              exit 1
            }
            echo "Known LIFEOS-1734 baseline reproduced exactly: 267 files would be reformatted."
          fi
          echo '--- remaining direct canonical proposal-document write references ---'
          git grep -n -E '(atomic_write_file_secure|write_bytes|write_text|os\.write).*proposal\.md|(atomic_write_file_secure|write_bytes|write_text|os\.write).*patches\.json|(atomic_write_file_secure|write_bytes|write_text|os\.write).*review\.json' -- src/lifeos || true

      - name: Commit validated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "LIFEOS-1731 Migrate remaining proposal publishers [lifeos-1731-applied]"
          git push origin HEAD:lifeos-1731-migrate-proposal-publishers
