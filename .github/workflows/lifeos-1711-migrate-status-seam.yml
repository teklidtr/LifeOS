name: LIFEOS-1711 status seam migration

on:
  push:
    branches:
      - lifeos-1711-secure-ownership-presence
    paths:
      - .github/workflows/lifeos-1711-migrate-status-seam.yml

permissions:
  contents: write

jobs:
  migrate-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lifeos-1711-secure-ownership-presence
          fetch-depth: 0

      - name: Migrate established regression to presence-aware seam
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tests/status/test_status.py)" = "50db6f8c44439aab562293a2d71612b11465964b"
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/status/test_status.py")
          text = path.read_text(encoding="utf-8")
          old = '    monkeypatch.setattr(GeneratedOwnership, "load", unsafe_load)\n'
          new = '    monkeypatch.setattr(GeneratedOwnership, "load_if_present", unsafe_load)\n'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one status seam, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra mcp

      - name: Validate migrated status seam
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          uv run pytest -q tests/status/test_status.py::test_status_path_safety_failure_preserves_partial_diagnostics
          uv run pytest -q tests/status tests/lint tests/ownership tests/facade/test_ownership_manifest_presence.py
          uv run ruff check tests/status/test_status.py
          git diff --check

      - name: Commit and push migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/status/test_status.py
          git commit -m "LIFEOS-1711 migrate status safety regression seam"
          git push origin HEAD:lifeos-1711-secure-ownership-presence
