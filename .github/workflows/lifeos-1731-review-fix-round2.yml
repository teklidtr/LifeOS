name: LIFEOS-1731 review fix round 2

on:
  push:
    branches:
      - lifeos-1731-migrate-proposal-publishers

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'LIFEOS-1731 Prepare Codex review round 2 fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lifeos-1731-migrate-proposal-publishers

      - name: Apply invariant-focused cleanup fix
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise RuntimeError(f"{path}: expected {count} matches, found {actual}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          publication = "src/lifeos/proposals/publication.py"
          replace(
              publication,
              '''        except OSError as exc:\n            raise ProposalPublicationError("proposal_publish_failed", str(exc)) from exc\n        created_identity = (created_info.st_dev, created_info.st_ino)''',
              '''        except OSError as exc:\n            _cleanup_staging_after_identity_lookup_failure(\n                parent_fd=proposals_fd,\n                name=directory_name,\n            )\n            raise ProposalPublicationError("proposal_publish_failed", str(exc)) from exc\n        created_identity = (created_info.st_dev, created_info.st_ino)''',
          )
          replace(
              publication,
              '''def _remove_owned_empty_directory(*, parent_fd: int, name: str, identity: FileIdentity) -> None:\n''',
              '''def _cleanup_staging_after_identity_lookup_failure(*, parent_fd: int, name: str) -> None:\n    """Remove a just-created empty staging directory only after re-binding its name to a secure fd."""\n    cleanup_fd = -1\n    try:\n        cleanup_fd = open_directory_secure(Path(name), dir_fd=parent_fd)\n        if not _directory_entry_matches(parent_fd, name, cleanup_fd):\n            return\n        try:\n            os.rmdir(name, dir_fd=parent_fd)\n        except OSError:\n            pass\n    except (SecureIOError, OSError):\n        return\n    finally:\n        if cleanup_fd >= 0:\n            os.close(cleanup_fd)\n\n\ndef _remove_owned_empty_directory(*, parent_fd: int, name: str, identity: FileIdentity) -> None:\n''',
          )

          test = Path("tests/proposals/test_publication.py")
          text = test.read_text(encoding="utf-8")
          if "import errno\n" not in text:
              text = text.replace("import os\n", "import errno\nimport os\n", 1)
          marker = '''\n\ndef test_partial_write_cleans_owned_staging_directory(\n'''
          insertion = '''\n\ndef test_staging_identity_lookup_failure_cleans_owned_directory(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    vault = _vault(tmp_path)\n    original_stat = publication_module.os.stat\n    injected = False\n\n    def fail_first_staging_identity_lookup(\n        path: object, *args: object, **kwargs: object\n    ):\n        nonlocal injected\n        if (\n            not injected\n            and isinstance(path, str)\n            and path.startswith(".lifeos-proposal-stage-")\n        ):\n            injected = True\n            raise OSError(errno.EIO, "injected staging identity lookup failure")\n        return original_stat(path, *args, **kwargs)\n\n    monkeypatch.setattr(publication_module.os, "stat", fail_first_staging_identity_lookup)\n\n    with pytest.raises(ProposalPublicationError) as failed:\n        publish_proposal_documents(\n            vault_root=vault,\n            proposal_id=PROPOSAL_ID,\n            documents=DOCUMENTS,\n        )\n\n    assert injected\n    assert failed.value.code == "proposal_publish_failed"\n    assert list((vault / "proposals").iterdir()) == []\n'''
          if marker not in text:
              raise RuntimeError("publication test insertion marker missing")
          text = text.replace(marker, insertion + marker, 1)
          test.write_text(text, encoding="utf-8")

          Path(".github/workflows/lifeos-1731-review-fix-round2.yml").unlink()

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra mcp

      - name: Format touched Python
        run: uv run ruff format src/lifeos/proposals/publication.py tests/proposals/test_publication.py

      - name: Validate cleanup invariant
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          uv run pytest -q tests/proposals/test_publication.py tests/proposals/test_remaining_publisher_adoption.py tests/ingestion/test_proposal_root_hardening.py
          uv run pytest -q tests/copilot tests/planning_feedback tests/reviews tests/ownership tests/ingestion tests/proposals
          uv run pytest -q tests/captures tests/conversations tests/experiments tests/patterns tests/facade tests/mcp tests/integration
          uv run pytest -q
          uv run ruff check .
          uv run mypy src
          python scripts/validate_tasks.py
          git diff --check
          uv run ruff format --check src/lifeos/proposals/publication.py tests/proposals/test_publication.py
          set +e
          uv run ruff format --check . > /tmp/lifeos-format.log 2>&1
          FORMAT_STATUS=$?
          set -e
          cat /tmp/lifeos-format.log
          if [ "$FORMAT_STATUS" -ne 0 ]; then
            COUNT=$(grep -Eo '[0-9]+ files would be reformatted' /tmp/lifeos-format.log | head -1 | grep -Eo '^[0-9]+')
            test -n "$COUNT"
            if [ "$COUNT" -gt 257 ]; then
              echo "Repository formatter debt regressed above LIFEOS-1734 branch baseline: $COUNT"
              exit 1
            fi
          fi

      - name: Record second review evidence
        env:
          RUN_ID: ${{ github.run_id }}
        shell: python
        run: |
          import os
          from pathlib import Path

          task = Path("tasks/completed/1731-migrate-remaining-proposal-document-publishers.md")
          text = task.read_text(encoding="utf-8")
          text += f'''\n\n### Second Codex review cleanup audit\n\nCodex re-review of head `ff331e075b3454de2358b11717ce5f1217203d4c` found one additional P2 variant of the same failed-attempt cleanup invariant: a staging directory could remain if the identity `stat` immediately after `mkdir` failed before `_create_staging_directory` returned ownership metadata. The shared publisher now handles that branch centrally by reopening the unguessable staging name through the secure directory primitive, verifying that the name is still bound to that opened directory, and removing only that still-owned empty directory. It never performs a blind name-only recursive cleanup. A dedicated regression test injects the first staging identity lookup failure and asserts no staging directory remains.\n\nPost-fix validation run `{os.environ["RUN_ID"]}` reran focused publisher/root-hardening coverage, both task validation groups, the full pytest suite, Ruff, mypy, task validation, diff checks, and touched-file formatting.\n'''
          task.write_text(text, encoding="utf-8")

      - name: Validate task evidence
        run: |
          python scripts/validate_tasks.py
          git diff --check

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "LIFEOS-1731 Close staging identity cleanup gap [lifeos-1731-review2-fix]"
          git push origin HEAD:lifeos-1731-migrate-proposal-publishers
