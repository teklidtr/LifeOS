services:
  lifeos:
    build:
      context: ../..
      dockerfile: deploy/home-node/Dockerfile
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "${LIFEOS_PUBLISH_ADDRESS:-127.0.0.1}:${LIFEOS_PORT:-8000}:8000"
    volumes:
      - "${LIFEOS_VAULT_PATH:?Set LIFEOS_VAULT_PATH to the canonical vault}:/vault"
      - lifeos-runtime:/vault/.lifeos
    environment:
      LIFEOS_SERVICE_TOKEN_FILE: /run/secrets/lifeos_service_token
    secrets:
      - lifeos_service_token
    command:
      - serve
      - --config
      - /vault/lifeos.yml
      - --actor-id
      - "${LIFEOS_ACTOR_ID:-home-node}"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --allowed-host
      - "${LIFEOS_ALLOWED_HOST:-127.0.0.1:*}"

volumes:
  lifeos-runtime:

secrets:
  lifeos_service_token:
    file: "${LIFEOS_TOKEN_FILE:?Set LIFEOS_TOKEN_FILE to a bearer-token file}"
